<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Webinar (teste)</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../portal.css">
<link rel="stylesheet" href="../../meet/slides.css"><link rel="stylesheet" href="../../meet/studio.css"><link rel="stylesheet" href="../../webinar/panel.css">
</head><body style="background:#f5f7fa;padding:24px">
<!-- Página só para os testes automáticos do Studio: contexto do painel simulado; o servidor é interceptado pelo Playwright. -->
<div id="view"></div><div id="ov"></div>
<script src="../../meet/slides.js"></script>
<script src="../../meet/studio.js"></script>
<script src="../../webinar-panel.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  window.ctx = {
    sb: { auth: { getSession: async () => ({ data: { session: { access_token: 'sessao-teste' } } }) }, from: () => ({ select: () => ({ eq: () => [] }) }),
      storage: { from: () => ({ uploadToSignedUrl: async (path, token, blob, o) => { window.__envio = { path, token, size: blob.size, tipo: o && o.contentType }; return { error: null }; } }) } },
    CFG: { functionsUrl: location.origin + '/fn', supabaseKey: 'anon' }, esc, q: async (x) => x || [],
    msg: (el, t) => { el.textContent = t; }, fmtDT: d => new Date(d).toLocaleString('pt-BR'),
    openOverlay: h => { const o = document.getElementById('ov'); o.innerHTML = '<div class="drawer">' + h + '</div>'; o.querySelector('.close-x') && (o.querySelector('.close-x').onclick = () => o.innerHTML = ''); return o; },
    closeOverlay: () => { document.getElementById('ov').innerHTML = ''; }
  };
</script>
</body></html>
<script>
  // como o admin: cada mudança de endereço desenha a tela de novo
  const desenhar = () => window.EWebinarPanel.render(document.getElementById('view'), window.ctx, { scope: 'client', clientId: 'c1' }).catch(e => { document.getElementById('view').textContent = 'ERRO: ' + e.message; });
  window.addEventListener('hashchange', desenhar);
</script>
