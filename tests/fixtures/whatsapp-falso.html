<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><title>WhatsApp (falso, para testes)</title>
<style>body{margin:0;font:14px sans-serif}#app{display:flex;height:100vh;width:100vw}#pane-side{width:260px;border-right:1px solid #ccc}#main{flex:1;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;padding:8px}.message-in,.message-out{margin:4px 0;padding:4px 8px;border-radius:6px;max-width:70%}.message-in{background:#eee}.message-out{background:#d9fdd3;margin-left:auto}
footer{display:flex;gap:6px;padding:6px;border-top:1px solid #ccc}footer [contenteditable]{flex:1;border:1px solid #aaa;min-height:24px;padding:4px}</style></head>
<body><div id="app">
<div id="pane-side"><div role="grid"></div></div>
<div id="vazio">Escolha uma conversa</div>
</div>
<script>
/* Simula o suficiente do WhatsApp Web: lista de conversas (#pane-side), conversa aberta (#main) com mensagens data-id e
   data-pre-plain-text, caixa contenteditable e botão Enviar. window.chegar(chave, texto, autor) simula uma mensagem recebida. */
var conversas = {
  '15551230000@c.us': { nome: 'Maria Teste', grupo: false, msgs: [{ eu: false, t: 'Oi, quero abrir uma LLC na Flórida. Quanto custa?', autor: 'Maria Teste' }], naoLidas: 0 },
  '120363000000000001@g.us': { nome: 'Grupo Empreendedores', grupo: true, msgs: [{ eu: false, t: 'Alguém sabe como tirar EIN?', autor: 'João' }, { eu: false, t: 'Também quero saber', autor: 'Ana' }], naoLidas: 0 },
  '15559990000@c.us': { nome: 'Carlos Novo', grupo: false, msgs: [], naoLidas: 0 }
};
var aberta = null, seq = 1;
function hora() { var d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
conversas['15551230000@c.us'].msgs[0].h = '08:00'; conversas['120363000000000001@g.us'].msgs.forEach(function (m) { m.h = '08:00'; });
function lista() {
  var g = document.querySelector('#pane-side [role="grid"]');
  g.innerHTML = Object.keys(conversas).map(function (k) {
    var c = conversas[k];
    return '<div role="listitem" data-k="' + k + '"><div role="gridcell" tabindex="0"><span dir="auto" title="' + c.nome + '">' + c.nome + '</span>' +
      (c.naoLidas ? ' <span aria-label="' + c.naoLidas + ' unread message">' + c.naoLidas + '</span>' : '') + '</div></div>';
  }).join('');
  g.querySelectorAll('[role="gridcell"]').forEach(function (el) { el.addEventListener('mousedown', function () { abrir(el.parentElement.dataset.k); }); });
}
function abrir(k) {
  aberta = k; conversas[k].naoLidas = 0; lista();
  var c = conversas[k], v = document.getElementById('vazio'); if (v) v.remove();
  var m = document.getElementById('main');
  if (!m) { m = document.createElement('div'); m.id = 'main'; document.getElementById('app').appendChild(m); }
  m.innerHTML = '<header><span dir="auto" title="' + c.nome + '">' + c.nome + '</span></header><div class="msgs"></div>' +
    '<footer><div contenteditable="true" role="textbox" data-tab="10"></div><button aria-label="Send">Enviar</button></footer>';
  desenhar();
  m.querySelector('footer button').onclick = function () {
    var box = m.querySelector('[contenteditable]'), t = box.innerText.trim(); if (!t) return;
    c.msgs.push({ eu: true, t: t, h: hora() }); box.innerHTML = ''; window.__enviadas = (window.__enviadas || []).concat([{ k: k, t: t }]); desenhar();
  };
}
function desenhar() {
  var c = conversas[aberta], box = document.querySelector('#main .msgs');
  box.innerHTML = c.msgs.map(function (x, i) {
    var id = (x.eu ? 'true_' : 'false_') + aberta + '_ID' + (x.id || (x.id = seq++));
    return '<div data-id="' + id + '" class="' + (x.eu ? 'message-out' : 'message-in') + '"><div class="copyable-text" data-pre-plain-text="[' + (x.h || hora()) + ', 11/16/2026] ' + (x.eu ? 'Eu' : x.autor) + ': "><span class="selectable-text"><span>' + x.t + '</span></span></div></div>';
  }).join('');
}
window.chegar = function (k, t, autor) {
  var c = conversas[k]; c.msgs.push({ eu: false, t: t, autor: autor || c.nome, h: hora() });
  if (aberta === k) desenhar(); else { c.naoLidas++; lista(); }
};
window.abrirConversa = abrir;
lista();
</script></body></html>
