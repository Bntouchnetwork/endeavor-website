<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add-ons (teste)</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../portal.css">
</head><body class="portal app-shell">
<!-- Página só para os testes automáticos: o portal e o banco são simulados; payments é interceptado pelo Playwright. -->
<div id="app"><div class="console" id="console"><nav class="console__nav" aria-label="menu"></nav><main class="console__content" id="view" tabindex="-1"></main></div></div>
<script src="../../fit-layout.js"></script>
<script src="../../store-catalog.js"></script>
<script src="../../client-tools.js"></script>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HOLD = /plano=holding/.test(location.search);
  const DATA = { client_services: HOLD ? [{ client_id: 'c1', product_code: 'pkg_holding', status: 'active', included_in: null }, { client_id: 'c1', product_code: 'bookkeeping', status: 'active', included_in: 'pkg_holding' },
    { client_id: 'c1', product_code: 'registered_agent', status: 'active', included_in: 'pkg_holding' }, { client_id: 'c1', product_code: 'virtual_address', status: 'active', included_in: 'pkg_holding' }] : [
    { client_id: 'c1', product_code: 'pkg_essencial', status: 'active', included_in: null },
    { client_id: 'c1', product_code: 'registered_agent', status: 'active', included_in: 'pkg_essencial' },
    { client_id: 'c1', product_code: 'virtual_address', status: 'active', included_in: 'pkg_essencial' },
    { client_id: 'c1', product_code: 'crm', status: 'active', included_in: null }] };
  function q(table) { const o = { _t: table, select() { return o; }, in() { return o; }, neq() { return o; }, eq() { return o; }, order() { return o; },
    then(res) { const p = table === 'store_products' ? fetch('/rest/v1/store_products').then(r => r.json()).then(d => ({ data: d })) : Promise.resolve({ data: DATA[table] || [] }); return p.then(res); } }; return o; }
  const C = {
    sb: { from: q, rpc: async (n) => ({ data: n === 'client_is_member' }), auth: { getSession: async () => ({ data: { session: { access_token: 't' } } }) } },
    CFG: { functionsUrl: location.origin + '/functions/v1', supabaseKey: 'anon' }, L: 'pt', esc, q: async p => (await p).data,
    head: (a, b) => '<h1>' + esc(a) + '</h1><p>' + esc(b) + '</p>', msg: (el, t) => { el.textContent = t; }, t: k => k, param: k => new URLSearchParams((location.hash.split('?')[1] || '')).get(k),
    S: { client: { id: 'c1', name: 'ACME' }, services: ['pkg_essencial'], waOn: false, meetOn: false }, openOverlay: () => document.createElement('div'), closeOverlay() {}, reload: async () => {}
  };
  ETools.init(C);
  const go = () => ETools.views[/^#\/addons/.test(location.hash) ? 'addons' : 'servicos'](document.getElementById('view')).catch(e => { document.getElementById('view').textContent = 'ERRO ' + e.message; });
  window.addEventListener('hashchange', go); go();
  window.__nav = ETools.nav().map(x => x[0]);
</script>
</body></html>
