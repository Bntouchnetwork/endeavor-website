        '<div class="field"><label for="d-notes">Observação (visível ao cliente)</label><textarea id="d-notes" rows="3">' + esc(it.notes || '') + '</textarea></div>' +
        '<div class="portal-alert" id="d-msg" role="alert"></div><div class="portal-btn-row"><button class="btn btn--navy" type="submit">Salvar</button>' + (it.id ? '<button class="btn btn--danger" type="button" id="d-del">Excluir</button>' : '') + '</div></form>');
      $('#dl-form').onsubmit = async function (e) {
        e.preventDefault();
        var row = { company_id: $('#d-co').value, title: $('#d-title').value.trim(), due_date: $('#d-date').value, category: $('#d-cat').value, notes: $('#d-notes').value.trim() || null };
        if (row.title.length < 2 || !row.due_date) return ctx.msg($('#d-msg'), 'Preencha título e vencimento.', 'error');
        var r = it.id ? await ctx.sb.from('compliance_items').update(row).eq('id', it.id) : await ctx.sb.from('compliance_items').insert(row);
        if (r.error) return ctx.msg($('#d-msg'), ctx.errText(r.error), 'error');
        ctx.closeOverlay(); ctx.route();
      };
      if ($('#d-del')) $('#d-del').onclick = async function () { if (!confirm('Excluir este prazo?')) return; await ctx.sb.from('compliance_items').delete().eq('id', it.id); ctx.closeOverlay(); ctx.route(); };
    }
    body.querySelector('#dl-showdone').onchange = draw;
    body.querySelector('#dl-new').onclick = function () { editDeadline(null); };
    draw();
  }

  /* ---------- users ---------- */
  var PERM_L = { access: 'Acesso do parceiro', companies: 'Empresas', allCompanies: 'Todas as empresas (inclusive novas)', docs: 'Documentos que pode ver', other: 'Outras permissões',
    cat_formation: 'Formação', cat_tax_return: 'Imposto de renda', cat_report: 'Relatórios financeiros', cat_compliance: 'Compliance', cat_other: 'Outros',
    deadlines: 'Pode ver os prazos fiscais', upload: 'Pode enviar documentos', docsHint: 'O parceiro sempre vê os documentos que ele mesmo enviou.', full: 'Acesso completo',
    docsShort: 'Docs', noDocs: 'Sem documentos', deadlinesShort: 'Prazos', uploadShort: 'Envio', noCompanies: 'Nenhuma empresa' };
  async function tabUsers(body, ctx, c, companies) {
    var esc = ctx.esc;
    companies = companies || [];
    var users = await ctx.q(ctx.sb.from('client_users').select('*').eq('client_id', c.id).order('role', { ascending: false }).order('invited_at'));
    var ST = { invited: 'Convidado', active: 'Ativo', revoked: 'Revogado' };
    body.innerHTML = '<div class="portal-btn-row" style="justify-content:flex-end;margin-bottom:1rem"><button class="btn btn--navy btn--xs" type="button" id="u-new">Adicionar usuário</button></div>' +
      '<div class="table-wrap"><table class="data"><thead><tr><th>Usuário</th><th>Perfil</th><th>Acesso</th><th>Status</th><th></th></tr></thead><tbody>' +
      users.map(function (u) {
        return '<tr style="cursor:default"><td><strong>' + esc(u.name || u.email) + '</strong><span class="sub">' + esc(u.email) + '</span></td><td>' + (u.role === 'owner' ? 'Titular · Portal do Cliente' : 'Parceiro · ' + esc(COLLAB[u.collab_type] || '') + '<span class="sub">Portal do Parceiro</span>') + '</td>' +
          '<td><span class="perm-sum">' + esc(EPerms.summary(u, PERM_L, companies)) + '</span></td>' +
          '<td><span class="pill' + (u.status === 'active' ? ' pill--done' : u.status === 'revoked' ? ' pill--overdue' : ' pill--soon') + '">' + ST[u.status] + '</span>' + (u.accepted_at ? '<span class="sub">desde ' + esc(ctx.fmtDT(u.accepted_at)) + '</span>' : '') + '</td>' +
          '<td><div class="portal-btn-row">' + (u.role !== 'owner' && u.status !== 'revoked' ? '<button class="btn btn--ghost btn--xs" data-perm="' + u.id + '">Permissões</button>' : '') +
          (u.status === 'invited' ? '<button class="btn btn--ghost btn--xs" data-resend="' + u.id + '">Reenviar convite</button>' : '') +
          (u.status !== 'revoked' ? '<button class="btn btn--danger btn--xs" data-revoke="' + u.id + '">Revogar</button>' : '<button class="btn btn--ghost btn--xs" data-restore="' + u.id + '">Reativar</button>') + '</div></td></tr>';
      }).join('') + '</tbody></table></div><p class="portal-muted" style="font-size:.85rem;margin-top:.75rem">O titular entra pelo Portal do Cliente. Contadores, bookkeepers e administradores de imóveis entram pelo Portal do Parceiro e só veem o que estiver liberado. Todos precisam ativar a verificação em duas etapas.</p>';
    var find = function (id) { return users.find(function (x) { return x.id === id; }); };
    body.querySelectorAll('[data-resend]').forEach(function (b) { b.onclick = async function () { var u = find(b.dataset.resend); var ok = await sendInvite(ctx, { clientId: c.id, email: u.email, name: u.name || u.email, clientName: c.name, role: u.role, lang: c.language }); alert(ok ? 'Convite reenviado.' : 'Não foi possível enviar agora.'); }; });
    body.querySelectorAll('[data-revoke]').forEach(function (b) { b.onclick = async function () { var u = find(b.dataset.revoke); if (!confirm('Revogar o acesso de ' + u.email + '?')) return; await ctx.sb.from('client_users').update({ status: 'revoked' }).eq('id', u.id); ctx.route(); }; });
    body.querySelectorAll('[data-restore]').forEach(function (b) { b.onclick = async function () { var u = find(b.dataset.restore); var r = await ctx.sb.from('client_users').update({ status: u.user_id ? 'active' : 'invited' }).eq('id', u.id); if (r.error) alert(ctx.errText(r.error)); ctx.route(); }; });
    body.querySelectorAll('[data-perm]').forEach(function (b) { b.onclick = function () { userForm(find(b.dataset.perm)); }; });
    body.querySelector('#u-new').onclick = function () { userForm(null); };
    function userForm(u) {
      var edit = !!u;
      ctx.openOverlay('<div class="drawer__head"><h2 class="portal-h2" style="margin:0">' + (edit ? 'Permissões: ' + esc(u.name || u.email) : 'Adicionar usuário') + '</h2><button class="close-x" type="button" aria-label="Fechar">×</button></div>' +
        '<form class="portal-form" id="u-form" novalidate>' + (edit ? '' : field('u-name', 'Nome', '', 'text', true) + field('u-email', 'E-mail', '', 'email', true) +
        select('u-role', 'Perfil', { collaborator: 'Parceiro (contador, bookkeeping, property management)', owner: 'Titular (acesso completo)' }, 'collaborator')) +
        '<div id="u-collab">' + select('u-type', 'Tipo de parceiro', COLLAB, u ? u.collab_type || 'other' : 'accountant') + EPerms.html('up', PERM_L, companies, u) + '</div>' +
        (edit ? '' : '<div class="check-row"><input type="checkbox" id="u-inv" checked><label for="u-inv">Enviar convite por e-mail</label></div>') +
        '<div class="portal-alert" id="u-msg" role="alert"></div><button class="btn btn--navy" type="submit">' + (edit ? 'Salvar permissões' : 'Adicionar') + '</button></form>');
      var form = $('#u-form');
      EPerms.wire(form, 'up', $('#u-type'), !edit);
      if ($('#u-role')) $('#u-role').onchange = function () { $('#u-collab').hidden = $('#u-role').value === 'owner'; };
      form.onsubmit = async function (e) {
        e.preventDefault();
        var role = edit ? u.role : $('#u-role').value, r;
        var perms = role === 'owner' ? { can_view: true, can_upload: true, perm_doc_categories: EPerms.CATS.slice(), perm_companies: null, perm_deadlines: true } : EPerms.read(form, 'up');
        if (perms.perm_companies && !perms.perm_companies.length) return ctx.msg($('#u-msg'), 'Escolha pelo menos uma empresa ou marque "Todas as empresas".', 'error');
        var row = Object.assign({ collab_type: role === 'owner' ? null : $('#u-type').value }, perms);
        if (edit) r = await ctx.sb.from('client_users').update(row).eq('id', u.id);
        else {
          var email = $('#u-email').value.trim().toLowerCase(), name = $('#u-name').value.trim();
          if (name.length < 2 || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return ctx.msg($('#u-msg'), 'Preencha nome e e-mail válido.', 'error');
          r = await ctx.sb.from('client_users').insert(Object.assign({ client_id: c.id, email: email, name: name, role: role }, row));
          if (!r.error && $('#u-inv').checked) await sendInvite(ctx, { clientId: c.id, email: email, name: name, clientName: c.name, role: role, lang: c.language });
        }
        if (r.error) return ctx.msg($('#u-msg'), /unique|duplicate/i.test(r.error.message) ? 'Este e-mail já tem acesso a este cliente.' : ctx.errText(r.error), 'error');
        ctx.closeOverlay(); ctx.route();
      };
    }
  }

  /* ---------- QuickBooks & reports ---------- */
  async function tabFinance(body, ctx, c, companies) {
    var esc = ctx.esc;
    if (!companies.length) { body.innerHTML = '<div class="portal-card empty-state"><strong>Cadastre uma empresa primeiro</strong></div>'; return; }
    var reports = await ctx.q(ctx.sb.from('company_documents').select('*').eq('client_id', c.id).eq('category', 'report').order('created_at', { ascending: false }));
    var stats = await Promise.all(companies.map(function (co) { return ctx.sb.rpc('qbo_status', { p_company: co.id }).then(function (r) { return (r.data || [])[0] || {}; }); }));
    var y = new Date().getFullYear(), qn = Math.floor(new Date().getMonth() / 3);
    var defQ = qn === 0 ? 4 : qn, defY = qn === 0 ? y - 1 : y;
    body.innerHTML = companies.map(function (co, i) {
      var s = stats[i], mine = reports.filter(function (r) { return r.company_id === co.id; });
      return '<section class="portal-card"><div class="toolbar" style="justify-content:space-between;align-items:center"><h2 class="portal-h2" style="margin:0">' + esc(co.legal_name) + '</h2>' +
        (s.connected ? '<span class="qbo-badge">QuickBooks conectado' + (s.qbo_company_name ? ': ' + esc(s.qbo_company_name) : '') + '</span>' : '<span class="pill">QuickBooks não conectado</span>') + '</div>' +
        (s.last_error ? '<div class="portal-alert portal-alert--error">' + esc(s.last_error) + '. Peça ao cliente para reconectar.</div>' : '') +
        '<div class="portal-btn-row">' + (s.connected ?
          '<select data-y="' + co.id + '" aria-label="Ano">' + [y, y - 1, y - 2].map(function (v) { return '<option' + (v === defY ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select>' +
          '<select data-q="' + co.id + '" aria-label="Período"><option value="1">1º trimestre</option><option value="2">2º trimestre</option><option value="3">3º trimestre</option><option value="4">4º trimestre</option><option value="0">Ano completo</option></select>' +
          '<button class="btn btn--navy btn--xs" data-gen="' + co.id + '">Gerar relatórios</button><button class="btn btn--danger btn--xs" data-disc="' + co.id + '">Desconectar</button>'
          : '<button class="btn btn--navy btn--xs" data-conn="' + co.id + '">Conectar QuickBooks</button><span class="portal-muted" style="font-size:.85rem">O titular também pode conectar pelo portal do cliente.</span>') + '</div>' +
        '<div class="portal-alert" id="qm-' + co.id + '" role="status"></div>' +
        (mine.length ? '<ul class="doclist" style="margin-top:.5rem">' + mine.map(function (d) { return '<li><span class="ficon" aria-hidden="true">PDF</span><div><div class="dname">' + esc(d.title) + '</div><div class="dmeta">' + esc(ctx.fmtDT(d.created_at)) + '</div></div><button class="btn btn--ghost btn--xs" data-rv="' + d.id + '">Ver</button></li>'; }).join('') + '</ul>' : '<p class="portal-muted" style="margin-top:.75rem">Nenhum relatório gerado ainda.</p>') +
        '</section>';
    }).join('');
    body.querySelectorAll('[data-q]').forEach(function (s) { s.value = String(defQ); });
    var call = async function (payload) {
      var sess = (await ctx.sb.auth.getSession()).data.session;
      var r = await fetch(ctx.CFG.functionsUrl + '/qbo', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ctx.CFG.supabaseKey, Authorization: 'Bearer ' + sess.access_token }, body: JSON.stringify(payload) });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
      return j;
    };
    var QERR = { qbo_not_configured: 'A integração com o QuickBooks ainda não foi configurada (Client ID e Secret da Intuit).', qbo_reconnect_required: 'A conexão expirou. É preciso reconectar o QuickBooks.', qbo_not_connected: 'QuickBooks não conectado.', future_period: 'Esse período ainda não começou.' };
    var err = function (id, e) { ctx.msg(body.querySelector('#qm-' + id), QERR[e.message] || ctx.errText(e), 'error'); };
    body.querySelectorAll('[data-conn]').forEach(function (b) { b.onclick = async function () {
      try { var j = await call({ action: 'connect', company_id: b.dataset.conn, return_to: location.href.split('#')[0] }); ERoute.go(j.url); } catch (e) { err(b.dataset.conn, e); }
    }; });
    body.querySelectorAll('[data-disc]').forEach(function (b) { b.onclick = async function () {
      if (!confirm('Desconectar o QuickBooks desta empresa?')) return;
      try { await call({ action: 'disconnect', company_id: b.dataset.disc }); ctx.route(); } catch (e) { err(b.dataset.disc, e); }
    }; });
    body.querySelectorAll('[data-gen]').forEach(function (b) { b.onclick = async function () {
      var id = b.dataset.gen; b.disabled = true; ctx.msg(body.querySelector('#qm-' + id), 'Gerando relatórios no QuickBooks…', 'info');
      try { await call({ action: 'generate', company_id: id, year: +body.querySelector('[data-y="' + id + '"]').value, quarter: +body.querySelector('[data-q="' + id + '"]').value }); ctx.route(); }
      catch (e) { b.disabled = false; err(id, e); }
    }; });
    body.querySelectorAll('[data-rv]').forEach(function (b) { b.onclick = function () { var d = reports.find(function (x) { return x.id === b.dataset.rv; }); ctx.viewFile('client-docs', d.path, d.title, { mime: 'application/pdf' }); }; });
  }

  window.AdminClients.standardDeadlines = standardDeadlines;
})();

</script>
<script>
/* Admin console: referral partners (pipeline, documents, timeline), Stripe invoices with partner split, and Endeavor's Stripe connection. */
(function () {
  'use strict';
  var TYPE = { referral: 'Indicação', accountant: 'Contador', bookkeeping: 'Bookkeeping', property_management: 'Property management', attorney: 'Advogado', realtor: 'Corretor de imóveis', other: 'Outro' };
  var PSTATUS = { invited: 'Convidado', active: 'Ativo', suspended: 'Suspenso' };
  var STAGES = ['submitted', 'contacted', 'proposal', 'onboarding', 'in_process', 'completed', 'lost'];
  var ST = { submitted: 'Recebida', contacted: 'Em contato', proposal: 'Proposta', onboarding: 'Cadastro', in_process: 'Em processamento', completed: 'Concluída', lost: 'Encerrada' };
  var DI = { pending: 'Pendente', received: 'Recebido', approved: 'Aprovado' };
  var IS = { draft: 'Rascunho', open: 'Em aberto', paid: 'Paga', void: 'Anulada', uncollectible: 'Não cobrável' };
  var TS = { none: '—', scheduled: 'Automático no pagamento', pending: 'Pendente', paid: 'Repassado', failed: 'Falhou', reversed: 'Estornado' };
  var ERR = { stripe_not_configured: 'A conta Stripe da Endeavor ainda não foi conectada (veja Pagamentos → Conta Stripe).', stripe_error: 'O Stripe recusou a operação', invalid_items: 'Revise os itens: descrição e valor são obrigatórios.',
    invalid_share: 'Percentual ou valor do parceiro inválido.', invoice_not_paid: 'A fatura ainda não foi paga.', nothing_to_transfer: 'Não há repasse pendente nesta fatura.', partner_not_ready: 'O parceiro ainda não concluiu o cadastro no Stripe.', bad_return_url: 'Endereço de retorno não permitido.' };
  var DOC_TEMPLATES = ['Passaporte do(s) sócio(s)', 'Comprovante de endereço', 'Nome e atividade da empresa', 'Formulário de cadastro (KYC)', 'Contrato de serviços assinado'];

  var money = function (c, cur) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: (cur || 'usd').toUpperCase() }).format((c || 0) / 100); };
  var fmtD = function (d) { if (!d) return ''; var x = new Date(d.length === 10 ? d + 'T12:00:00' : d); return x.toLocaleDateString('pt-BR'); };
  var pill = function (cls, s, label) { return '<span class="' + cls + ' ' + cls + '--' + s + '">' + label + '</span>'; };
  function stripeOf(p) {
    if (!p.stripe_account_id) return pill('stripe-st', 'none', 'Stripe não conectado');
    if (p.stripe_transfers_active) return pill('stripe-st', 'ok', 'Stripe pronto');
    if (p.stripe_details_submitted) return pill('stripe-st', 'review', 'Stripe em análise');
    return pill('stripe-st', 'incomplete', 'Cadastro Stripe incompleto');
  }
  async function call(ctx, payload) {
    var sess = (await ctx.sb.auth.getSession()).data.session;
    var r = await fetch(ctx.CFG.functionsUrl + '/payments', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ctx.CFG.supabaseKey, Authorization: 'Bearer ' + sess.access_token }, body: JSON.stringify(payload) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok || j.error) { var e = new Error(j.error || 'HTTP ' + r.status); e.detail = j.detail; throw e; }
    return j;
  }
  var errMsg = function (ctx, e) { return (ERR[e.message] || ctx.errText(e)) + (e.detail ? ': ' + e.detail : ''); };
  function param(k) { var m = ERoute.get().match(new RegExp('[?&]' + k + '=([^&]+)')); return m ? decodeURIComponent(m[1]) : null; }
  function head(esc, title, lead, actions) { return '<div class="console__head"><div><h1>' + esc(title) + '</h1>' + (lead ? '<p class="portal-muted">' + esc(lead) + '</p>' : '') + '</div>' + (actions || '') + '</div>'; }
  function kpi(esc, l, v) { return '<div class="kpi"><div class="kpi__label">' + esc(l) + '</div><div class="kpi__value" style="font-size:1.35rem;padding-top:.35rem">' + esc(v) + '</div></div>'; }

  async function sendInvite(ctx, p) {
    var link = ctx.siteUrl('partner.html') + '?lang=' + (p.language || 'pt');
    try { await call(ctx, { action: 'send_access', partner_id: p.id }); } catch (e) { return false; }
    try {
      var r = await fetch(ctx.CFG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _subject: 'Convite ao Programa de Parceiros: ' + p.name, _template: 'table', _captcha: 'false', name: p.name, email: p.email, empresa: p.company || '', link: link,
          _autoresponse: window.EndeavorInvite.text(p.language || 'pt', { name: p.name, email: p.email, link: link, referral: true }) }) });
      var j = await r.json().catch(function () { return {}; });
      return r.ok && String(j.success) !== 'false';
    } catch (e) { return false; }
  }

  /* ================= Parceiros ================= */
  async function partnersList(view, ctx) {
    var esc = ctx.esc, sb = ctx.sb;
    var res = await Promise.all([ctx.q(sb.from('partners').select('*').order('name')), ctx.q(sb.from('referrals').select('partner_id, status')), ctx.q(sb.from('invoices').select('partner_id, partner_amount_cents, transfer_status, status').not('partner_id', 'is', null))]);
    var parts = res[0], refs = res[1], invs = res[2];
    var total = function (pid, f) { return invs.filter(function (i) { return i.partner_id === pid && f(i); }).reduce(function (s, i) { return s + i.partner_amount_cents; }, 0); };
    var pendingAll = invs.filter(function (i) { return i.status === 'paid' && i.transfer_status === 'pending'; }).reduce(function (s, i) { return s + i.partner_amount_cents; }, 0);
    view.innerHTML = head(esc, 'Parceiros', 'Programa de indicações: convide parceiros, acompanhe as indicações e os repasses de comissão via Stripe Connect.', '<button class="btn btn--navy" type="button" id="pt-new">Novo parceiro</button>') +
      '<div class="kpis" style="margin-bottom:1.25rem">' + kpi(esc, 'Parceiros ativos', parts.filter(function (p) { return p.status === 'active'; }).length) + kpi(esc, 'Indicações', refs.length) +
      kpi(esc, 'Viraram clientes', refs.filter(function (r) { return ['onboarding', 'in_process', 'completed'].indexOf(r.status) > -1; }).length) + kpi(esc, 'Repasses pendentes', money(pendingAll)) + '</div>' +
      (parts.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>Parceiro</th><th>Tipo</th><th>Status</th><th class="num">Comissão</th><th>Stripe</th><th class="num">Indicações</th><th class="num">Repassado</th><th class="num">A repassar</th></tr></thead><tbody>' +
        parts.map(function (p) {
          var n = refs.filter(function (r) { return r.partner_id === p.id; }).length;
          return '<tr data-id="' + p.id + '" tabindex="0"><td><strong>' + esc(p.name) + '</strong><span class="sub">' + esc([p.company, p.email].filter(Boolean).join(' · ')) + '</span></td><td>' + esc(TYPE[p.partner_type]) + '</td>' +
            '<td><span class="badge badge--' + (p.status === 'active' ? 'client' : p.status === 'invited' ? 'new' : 'lost') + '">' + PSTATUS[p.status] + '</span></td><td class="num">' + esc(String(+p.default_share_pct)) + '%</td><td>' + stripeOf(p) + '</td>' +
            '<td class="num">' + n + '</td><td class="num">' + esc(money(total(p.id, function (i) { return i.transfer_status === 'paid'; }))) + '</td><td class="num">' + esc(money(total(p.id, function (i) { return ['scheduled', 'pending', 'failed'].indexOf(i.transfer_status) > -1 && i.status !== 'void'; }))) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="empty-state portal-card"><strong>Nenhum parceiro ainda</strong><p>Convide contadores, corretores, advogados e outros parceiros que indicam clientes.</p></div>');
    view.querySelectorAll('tr[data-id]').forEach(function (tr) {
      var go = function () { ERoute.go('#/parceiros?id=' + tr.dataset.id); };
      tr.onclick = go; tr.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    });
    ctx.$('#pt-new').onclick = function () { partnerForm(ctx, null); };
    if (param('novo')) partnerForm(ctx, null);
  }

  function partnerForm(ctx, p) {
    var esc = ctx.esc, edit = !!p; p = p || { language: 'pt', partner_type: 'referral', default_share_pct: 10 };
    var o = ctx.openOverlay('<div class="drawer__head"><h2 class="portal-h2" style="margin:0">' + (edit ? 'Editar parceiro' : 'Novo parceiro') + '</h2><button class="close-x" type="button" aria-label="Fechar">×</button></div>' +
      '<form class="portal-form" id="pf" novalidate><div class="field"><label for="pf-name">Nome</label><input id="pf-name" required maxlength="200" value="' + esc(p.name || '') + '"></div>' +

  /* ================= Pagamentos ================= */
  function invoiceTable(ctx, rows, hidePartner) {
    var esc = ctx.esc;
    return '<div class="table-wrap"><table class="data inv-table"><thead><tr><th>Fatura</th><th>Cliente</th>' + (hidePartner ? '' : '<th>Parceiro</th>') + '<th class="num">Total</th><th class="num">Parceiro</th><th>Status</th><th>Repasse</th><th>Ações</th></tr></thead><tbody>' +
      rows.map(function (i) {
        var acts = [];
        if (i.status === 'draft') acts.push('<button class="btn btn--navy btn--xs" data-act="invoice_send" data-i="' + i.id + '">Enviar</button>');
        if (i.hosted_invoice_url) acts.push('<a class="btn btn--ghost btn--xs" href="' + esc(i.hosted_invoice_url) + '" target="_blank" rel="noopener">Ver</a>');
        var ready = i.partners && i.partners.stripe_transfers_active;
        if (i.status === 'paid' && (i.transfer_status === 'pending' || i.transfer_status === 'failed')) acts.push(ready ? '<button class="btn btn--navy btn--xs" data-act="transfer" data-i="' + i.id + '">Repassar</button>' : '<span class="portal-muted" style="font-size:.82rem">Aguardando Stripe do parceiro</span>');
        if (i.status === 'open' || i.status === 'uncollectible') acts.push('<button class="btn btn--ghost btn--xs" data-act="invoice_sync" data-i="' + i.id + '">Sincronizar</button>');
        if (i.status !== 'paid' && i.status !== 'void') acts.push('<button class="btn btn--danger btn--xs" data-act="invoice_void" data-i="' + i.id + '">Anular</button>');
        return '<tr><td><strong>' + esc(i.number || 'Rascunho') + '</strong><span class="sub">' + esc(fmtD(i.created_at)) + (i.due_date ? ' · vence ' + esc(fmtD(i.due_date)) : '') + '</span></td><td>' + esc(i.clients ? i.clients.name : '') + '</td>' +
          (hidePartner ? '' : '<td>' + esc(i.partners ? i.partners.name : '—') + '</td>') + '<td class="num">' + esc(money(i.total_cents, i.currency)) + '</td>' +
          '<td class="num">' + (i.partner_id ? esc(money(i.partner_amount_cents, i.currency)) + (i.partner_pct != null ? ' <span class="portal-muted">(' + esc(String(+i.partner_pct)) + '%)</span>' : '') : '—') + '</td>' +
          '<td>' + pill('inv-st', i.status, IS[i.status]) + '</td><td>' + esc(TS[i.transfer_status]) + '</td><td><div class="portal-btn-row" style="flex-wrap:nowrap">' + acts.join('') + '</div><div class="portal-alert" id="ia-' + i.id + '" role="status"></div></td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function wireInvoiceActions(root, ctx) {
    root.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = async function (e) {
        e.stopPropagation();
        if (b.dataset.act === 'invoice_void' && !confirm('Anular esta fatura no Stripe? O cliente não poderá mais pagá-la.')) return;
        if (b.dataset.act === 'transfer' && !confirm('Repassar agora a comissão do parceiro para a conta Stripe dele?')) return;
        b.disabled = true;
        try { await call(ctx, { action: b.dataset.act, invoice_id: b.dataset.i }); ctx.route(); }
        catch (x) { b.disabled = false; ctx.msg(ctx.$('#ia-' + b.dataset.i), errMsg(ctx, x), 'error'); }
      };
    });
  }

      '<nav class="subtabs" aria-label="Seções">' + tabs.map(function (t) { return '<a href="#/pagamentos?tab=' + t[0] + '"' + (t[0] === tab ? ' aria-current="page"' : '') + '>' + t[1] + '</a>'; }).join('') + '</nav><div id="pg-body"></div>';
    var body = ctx.$('#pg-body');
    if (tab === 'nova') return newInvoice(body, ctx);
    if (tab === 'propostas') return proposalsTab(body, ctx);

    if (tab === 'modelos') return param('tpl') ? templateForm(body, ctx, param('tpl')) : templatesTab(body, ctx);

    var rows = await ctx.q(ctx.sb.from('invoices').select('*, clients(name), partners(name, stripe_transfers_active)').order('created_at', { ascending: false }));
    var st = param('status') || '';
    var shown = rows.filter(function (i) { return !st || i.status === st; });
    var now = new Date(), ym = now.toISOString().slice(0, 7);
    var open = rows.filter(function (i) { return i.status === 'open'; }).reduce(function (s, i) { return s + i.total_cents - i.amount_paid_cents; }, 0);

    var toPartners = rows.filter(function (i) { return i.status !== 'void' && ['scheduled', 'pending', 'failed'].indexOf(i.transfer_status) > -1; }).reduce(function (s, i) { return s + i.partner_amount_cents; }, 0);
    body.innerHTML = '<div class="kpis" style="margin-bottom:1.25rem">' + kpi(esc, 'Em aberto', money(open)) + kpi(esc, 'Recebido no mês', money(month)) + kpi(esc, 'Comissões a repassar', money(toPartners)) + kpi(esc, 'Faturas', rows.length) + '</div>' +
      '<div class="toolbar"><label for="pg-st" class="sr-only">Status</label><select id="pg-st"><option value="">Todos os status</option>' + Object.keys(IS).map(function (k) { return '<option value="' + k + '"' + (st === k ? ' selected' : '') + '>' + IS[k] + '</option>'; }).join('') + '</select></div>' +

      '<li>Crie também <code>STRIPE_PUBLISHABLE_KEY</code> com a <strong>Publishable key</strong> (<code>pk_test_…</code>). Ela liga o checkout dentro do Portal do Cliente.</li>' +
      '<li>Em <strong>Settings → Payment methods</strong>, ative as formas de pagamento: cartões, Apple Pay e Google Pay, Link, transferência bancária dos EUA (ACH) e <strong>Pix</strong> (para clientes no Brasil; o Stripe cobra o IOF do pagador por padrão). Confira também em <strong>Settings → Invoices</strong> as formas aceitas nas faturas.</li>' +
      '<li>No Stripe, ative o <strong>Connect</strong> (Settings → Connect) como plataforma, com contas <strong>Express</strong>.</li>' +
      '<li>Em <strong>Developers → Webhooks</strong>, crie um endpoint para <code>' + esc(hook) + '</code> com os eventos <code>invoice.*</code> e <code>transfer.reversed</code>. Salve o signing secret em <code>STRIPE_WEBHOOK_SECRET</code>.</li>' +
      '<li>Crie um segundo endpoint para o mesmo endereço marcando <strong>eventos de contas conectadas</strong>, com <code>account.updated</code>. Salve em <code>STRIPE_CONNECT_WEBHOOK_SECRET</code>.</li>' +
      '<li>Clique em <strong>Verificar conexão</strong>. Para produção, troque a chave pela <code>sk_live_…</code> e refaça os webhooks no modo live.</li></ol>' +
      '<button class="btn btn--ghost btn--xs" type="button" id="sx-copy">Copiar endereço do webhook</button></aside></div>';
    ctx.$('#sx-copy').onclick = function () { ctx.copy(hook, this); };
    ctx.$('#sx-check').onclick = async function () {
      this.disabled = true; ctx.msg(ctx.$('#sx-m'), 'Consultando o Stripe…', 'info');
      try { var j = await call(ctx, { action: 'status' }); if (!j.configured) { this.disabled = false; return ctx.msg(ctx.$('#sx-m'), 'A chave STRIPE_SECRET_KEY ainda não foi criada no Supabase.', 'error'); } ctx.route(); }
      catch (e) { this.disabled = false; ctx.msg(ctx.$('#sx-m'), errMsg(ctx, e), 'error'); }
    };
    ctx.$('#sx-f').onsubmit = async function (e) {
      e.preventDefault();
      var r = await sb.from('stripe_settings').update({ default_days_until_due: +ctx.$('#sx-days').value, default_partner_pct: +ctx.$('#sx-pct').value }).eq('id', 1);
      ctx.msg(ctx.$('#sx-m'), r.error ? ctx.errText(r.error) : 'Padrões salvos.', r.error ? 'error' : 'ok');
    };
  }

  window.AdminPayments = {
    partners: function (view, ctx) { var id = (ERoute.get().match(/[?&]id=([0-9a-f-]{36})/) || [])[1]; return id ? partnerDetail(view, ctx, id) : partnersList(view, ctx); },
    payments: payments,
    bell: bell
  };
})();

</script>
<script>
/* Endeavor admin console: login + MFA, dashboard, CRM, scheduling and e-signature. */
(function () {
  'use strict';
  var CFG = window.ENDEAVOR_CFG;
  var AUTH_HASH = String(location.hash || '');
  var AUTH_TYPE = (AUTH_HASH.match(/[#&]type=(invite|recovery)/) || [])[1] || null;
  var AUTH_ERR = /[#&]error_code=/.test(AUTH_HASH);
  var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  var app = document.getElementById('app');
  var state = { settings: null, leads: [], bookings: [], envelopes: [] };

  /* ---------- helpers ---------- */
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  var STATUS_PT = { new: 'Novo', contacted: 'Contatado', qualified: 'Qualificado', proposal: 'Proposta', client: 'Cliente', lost: 'Perdido',
    sent: 'Enviado', viewed: 'Visualizado', signed: 'Assinado', voided: 'Anulado', expired: 'Expirado',
    confirmed: 'Confirmado', cancelled: 'Cancelado', completed: 'Concluído', no_show: 'Não compareceu' };
  var SOURCE_PT = { contact_form: 'Formulário', booking: 'Agendamento', manual: 'Manual', partner: 'Parceiro' };
  var MEET_PT = { video: 'Vídeo', phone: 'Telefone', whatsapp: 'WhatsApp' };
  function badge(s) { return '<span class="badge badge--' + esc(s) + '">' + esc(STATUS_PT[s] || s) + '</span>'; }
  function tz() { return (state.settings && state.settings.timezone) || 'America/New_York'; }
  function fmtDT(iso, opts) {
    if (!iso) return '';
    return new Intl.DateTimeFormat('pt-BR', Object.assign({ timeZone: tz(), dateStyle: 'short', timeStyle: 'short' }, opts || {})).format(new Date(iso));
  }
  function fmtDay(iso) { return new Intl.DateTimeFormat('pt-BR', { timeZone: tz(), weekday: 'long', day: '2-digit', month: 'long' }).format(new Date(iso)); }
  function msg(el, text, kind) { if (!el) return; el.className = 'portal-alert portal-alert--' + (kind || 'info'); el.textContent = text || ''; }
  function errText(e) {
    var m = (e && (e.message || e.error_description || e.msg)) || String(e);
    if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link enviado pelo Supabase antes de entrar.';
    if (/Invalid TOTP|invalid.*code/i.test(m)) return 'Código inválido. Confira o horário do celular e tente de novo.';
    if (/Password should|weak.?password|pwned|leaked/i.test(m)) return 'Senha fraca. Use pelo menos 8 caracteres, com letras maiúsculas e minúsculas, números e um símbolo.';
    if (/same.?password|different from the old/i.test(m)) return 'A nova senha precisa ser diferente da atual.';
    if (/row-level security|permission denied/i.test(m)) return 'Sem permissão. Entre novamente com verificação em duas etapas.';
    return m;
  }
  function download(name, content, type) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/plain' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  async function sha256Hex(buf) {
    var d = await crypto.subtle.digest('SHA-256', buf);
    return Array.prototype.map.call(new Uint8Array(d), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function siteUrl(file) { try { if (/^(https?|file):/.test(location.protocol)) return new URL(file, location.href).href.split('#')[0]; } catch (e) { /* ignore */ } return 'https://endeavorbiz.com/' + file; }
  function copy(text, btn) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
      if (btn) { var t = btn.textContent; btn.textContent = 'Copiado ✓'; setTimeout(function () { btn.textContent = t; }, 1600); }
    }).catch(function () { window.prompt('Copie o link:', text); });
  }

  /* ---------- auth flow ---------- */
  var recoveryMode = !!AUTH_TYPE, pwShown = false;
  sb.auth.onAuthStateChange(function (ev) {
    if (!pwShown && (ev === 'PASSWORD_RECOVERY' || (recoveryMode && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')))) { recoveryMode = true; pwShown = true; renderNewPassword(AUTH_TYPE === 'invite'); return; }
    if (ev === 'SIGNED_OUT') { renderLogin(); }
  });
  if (recoveryMode) setTimeout(async function () { if (pwShown) return; var s = (await sb.auth.getSession()).data.session; pwShown = true; if (!s) { recoveryMode = false; renderForgot(true); } else renderNewPassword(AUTH_TYPE === 'invite'); }, 2500);
  document.getElementById('btn-signout').addEventListener('click', async function () { await sb.auth.signOut(); ERoute.set('', true); renderLogin(); });

  async function boot() {
    if (recoveryMode) return;
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return renderLogin();
    var u = s.user;
    $('#topbar-user').hidden = false; $('#topbar-email').textContent = u.email;
    if (String(u.email).toLowerCase() !== String(CFG.adminEmail).toLowerCase()) {
      var ok = (await sb.rpc('is_admin_email')).data;
      if (!ok) return renderDenied(u.email);
    }
    var aal = (await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data;
    if (!aal || aal.currentLevel !== 'aal2') return renderMfa();
    var isAdmin = (await sb.rpc('is_admin')).data;
    if (!isAdmin) return renderDenied(u.email);
    startConsole();
  }

  function authShell(inner) {
    $('#topbar-user').hidden = true;
    app.innerHTML = '<main class="portal-main"><div class="auth portal-card">' + inner + '</div></main>';
  }

  function pwField(id, label, auto) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><div class="pw-wrap"><input id="' + id + '" type="password" autocomplete="' + auto + '" required>' +
      '<button type="button" class="pw-eye" data-eye="' + id + '" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button></div></div>';
  }
  function wireEyes() { $$('[data-eye]').forEach(function (b) { b.onclick = function () { var i = document.getElementById(b.dataset.eye), on = i.type === 'password'; i.type = on ? 'text' : 'password'; b.setAttribute('aria-pressed', String(on)); }; }); }
  function renderLogin() {
    if (AUTH_ERR) { AUTH_ERR = false; history.replaceState(null, '', location.pathname); return renderForgot(true); }
    authShell(
      '<h1 class="portal-h1">Console Admin</h1><p class="portal-muted">Acesso restrito à equipe da Endeavor.</p>' +
      '<form class="portal-form" id="f-login" novalidate>' +
      '<div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username" required></div>' +
      pwField('l-pass', 'Senha', 'current-password') +
      '<div class="portal-alert" id="l-msg" role="alert"></div>' +
      '<button class="btn btn--navy btn--block" type="submit">Entrar</button>' +
      '<p class="auth-links"><a href="#" id="l-forgot">Esqueci a senha</a></p></form>');
    wireEyes();
    var m = $('#l-msg');
    $('#f-login').addEventListener('submit', async function (e) {
      e.preventDefault();
      msg(m, 'Entrando…', 'info');
      var r = await sb.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-pass').value });
      if (r.error) return msg(m, errText(r.error), 'error');
      boot();
    });
    $('#l-forgot').addEventListener('click', function (e) { e.preventDefault(); renderForgot(false, $('#l-email').value.trim()); });
  }

  function renderForgot(expired, email) {
    authShell('<h1 class="portal-h1">Redefinir senha</h1><p class="portal-muted">Digite o seu e-mail. Vamos enviar um link para você criar uma nova senha.</p>' +
      (expired ? '<div class="portal-alert portal-alert--error" style="display:block">Este link expirou ou já foi usado. Peça um novo abaixo.</div>' : '') +
      '<form class="portal-form" id="f-forgot" novalidate><div class="field"><label for="fg-email">E-mail</label><input id="fg-email" type="email" autocomplete="username" required value="' + esc(email || '') + '"></div>' +
      '<div class="portal-alert" id="fg-msg" role="status"></div><button class="btn btn--navy btn--block" type="submit">Enviar link</button>' +
      '<p class="auth-links"><a href="#" id="fg-back">Voltar ao login</a></p></form>');
    $('#fg-back').addEventListener('click', function (e) { e.preventDefault(); renderLogin(); });
    $('#f-forgot').addEventListener('submit', async function (e) {
      e.preventDefault();
      var em = $('#fg-email').value.trim().toLowerCase(), m = $('#fg-msg');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) return msg(m, 'Digite um e-mail válido.', 'error');
      var btn = this.querySelector('button[type=submit]'); if (btn.disabled) return; btn.disabled = true;
      var r = await sb.auth.resetPasswordForEmail(em, { redirectTo: siteUrl('admin.html') });
      var limited = r.error && /rate|limit|seconds/i.test(r.error.message);
      // same message whether or not the e-mail exists (no account enumeration); the address is echoed so typos are visible
      msg(m, limited ? errText(r.error) : 'Se ' + em + ' estiver cadastrado, você vai receber em alguns minutos um link para criar uma nova senha. Confira se o endereço está certo e olhe também o spam. Você pode pedir de novo em 60 segundos.', limited ? 'error' : 'ok');
      setTimeout(function () { btn.disabled = false; }, limited ? 5000 : 60000);
    });
  }

  function renderNewPassword(invite) {
    authShell('<h1 class="portal-h1">' + (invite ? 'Crie a sua senha' : 'Crie uma nova senha') + '</h1><p class="portal-muted">' + (invite ? 'Bem-vindo ao console da Endeavor. Depois da senha você ativa o código do celular.' : 'Escolha uma nova senha para a sua conta.') + '</p>' +
      '<form class="portal-form" id="f-np" novalidate>' + pwField('np', 'Nova senha (mín. 8 caracteres)', 'new-password') + pwField('np2', 'Confirme a senha', 'new-password') +
      '<div class="field" id="np-code-wrap" hidden><label for="np-code">Código do autenticador</label><input id="np-code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6">' +
      '<p class="portal-muted" style="font-size:.85rem;margin:.35rem 0 0">Sua conta usa verificação em duas etapas. Digite o código de 6 dígitos que aparece no Google Authenticator em "Endeavor Business Solutions".</p></div>' +
      '<div class="portal-alert" id="np-msg" role="alert"></div><button class="btn btn--navy btn--block" type="submit">Salvar senha</button></form>');
    wireEyes();
    var showCode = function () { $('#np-code-wrap').hidden = false; };
    // accounts with two-step verification must confirm the code (AAL2) before Supabase accepts a new password
    sb.auth.mfa.getAuthenticatorAssuranceLevel().then(function (r) { var a = r.data; if (a && a.nextLevel === 'aal2' && a.currentLevel !== 'aal2') showCode(); }, function () {});
    $('#f-np').addEventListener('submit', async function (e) {
      e.preventDefault();
      var m = $('#np-msg'), p = $('#np').value; if (p.length < 8) return msg(m, 'Use pelo menos 8 caracteres.', 'error');
      if (p !== $('#np2').value) return msg(m, 'As senhas não são iguais.', 'error');
      var btn = this.querySelector('button[type=submit]'); btn.disabled = true;
      try {
        if (!$('#np-code-wrap').hidden) {
          var code = $('#np-code').value.replace(/\D/g, '');
          if (code.length !== 6) { $('#np-code').focus(); return msg(m, 'Digite o código de 6 dígitos do autenticador.', 'error'); }
          var f = ((await sb.auth.mfa.listFactors()).data || {}).totp || [], v = f.filter(function (x) { return x.status === 'verified'; })[0];
          if (v) { var cv = await sb.auth.mfa.challengeAndVerify({ factorId: v.id, code: code }); if (cv.error) return msg(m, errText(cv.error), 'error'); }
        }
        var r = await sb.auth.updateUser({ password: p });
        if (r.error) {
          if (/aal2/i.test(r.error.message)) { showCode(); $('#np-code').focus(); return msg(m, 'Digite o código do autenticador para confirmar a troca de senha.', 'error'); }
          return msg(m, errText(r.error), 'error');
        }
        recoveryMode = false; history.replaceState(null, '', location.pathname); boot();
      } finally { btn.disabled = false; }
    });
  }

  function renderDenied(email) {
    authShell('<h1 class="portal-h1">Acesso negado</h1><p>A conta <strong>' + esc(email) + '</strong> não tem permissão de administrador.</p>' +
      '<button class="btn btn--navy" type="button" id="d-out">Sair</button>');
    $('#d-out').addEventListener('click', async function () { await sb.auth.signOut(); renderLogin(); });
  }

  async function renderMfa() {
    var f = (await sb.auth.mfa.listFactors()).data || { totp: [], all: [] };
    var verified = (f.totp || []).filter(function (x) { return x.status === 'verified'; });
    if (verified.length) {
      authShell('<h1 class="portal-h1">Verificação em duas etapas</h1><p class="portal-muted">Digite o código de 6 dígitos do seu aplicativo autenticador.</p><p class="portal-muted" style="font-size:.88rem">Abra o Google Authenticator e use o código que aparece em <strong>Endeavor Business Solutions</strong>. Perdeu o celular? Peça para resetar a verificação da conta no Supabase (Authentication → Users).</p>' +
        '<form class="portal-form" id="f-mfa"><div class="field"><label for="mfa-code">Código</label><input id="mfa-code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>' +
        '<div class="portal-alert" id="mfa-msg" role="alert"></div><button class="btn btn--navy btn--block" type="submit">Verificar</button></form>');
      $('#mfa-code').focus();
      $('#f-mfa').addEventListener('submit', async function (e) {
        e.preventDefault();
        var r = await sb.auth.mfa.challengeAndVerify({ factorId: verified[0].id, code: $('#mfa-code').value.trim() });
        if (r.error) return msg($('#mfa-msg'), errText(r.error), 'error');
        boot();
      });
      return;
    }
    // remove abandoned, unverified factors, then enroll a new one
    for (var i = 0; i < (f.all || []).length; i++) { if (f.all[i].status !== 'verified') await sb.auth.mfa.unenroll({ factorId: f.all[i].id }); }
    var en = await sb.auth.mfa.enroll({ factorType: 'totp', issuer: 'Endeavor Business Solutions', friendlyName: 'Endeavor Console ' + new Date().toISOString().slice(0, 10) });
    if (en.error) { authShell('<div class="portal-alert portal-alert--error">' + esc(errText(en.error)) + '</div>'); return; }
    authShell('<h1 class="portal-h1">Ative a verificação em duas etapas</h1>' +
      '<p class="portal-muted">Obrigatória para acessar o console.</p>' +
      '<ol class="mfa-steps"><li>Instale no celular o app gratuito <strong>Google Authenticator</strong> (<a href="' + EndeavorInvite.IOS + '" target="_blank" rel="noopener">iPhone</a> · <a href="' + EndeavorInvite.AND + '" target="_blank" rel="noopener">Android</a>). O ícone é um asterisco colorido.</li>' +
      '<li>No app, toque no <strong>+</strong> e escolha <strong>Ler código QR</strong>. Aponte a câmera para o código abaixo.</li>' +
      '<li>Digite o código de 6 dígitos que aparece no app (muda a cada 30 segundos) e clique em <strong>Ativar e entrar</strong>.</li></ol>' +
      '<div class="auth__qr"><img alt="QR code para o aplicativo autenticador" src="' + esc(en.data.totp.qr_code) + '"></div>' +
      '<p class="portal-muted">Sem câmera? Digite esta chave no app: <span class="mono">' + esc(en.data.totp.secret) + '</span></p>' +
      '<form class="portal-form" id="f-enroll"><div class="field"><label for="en-code">Código de 6 dígitos</label><input id="en-code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>' +
      '<div class="portal-alert" id="en-msg" role="alert"></div><button class="btn btn--navy btn--block" type="submit">Ativar e entrar</button></form>');
    $('#f-enroll').addEventListener('submit', async function (e) {
      e.preventDefault();
      var r = await sb.auth.mfa.challengeAndVerify({ factorId: en.data.id, code: $('#en-code').value.trim() });
      if (r.error) return msg($('#en-msg'), errText(r.error), 'error');
      boot();
    });
  }

  /* ---------- console shell ---------- */
  var NAV = [
    ['dashboard', 'Dashboard', 'i-grid'], ['crm', 'CRM', 'i-users'], ['clientes', 'Clientes', 'i-brief'], ['agenda', 'Agenda', 'i-cal'],
    ['assinaturas', 'Assinaturas', 'i-pen'], ['parceiros', 'Parceiros', 'i-handshake'], ['pagamentos', 'Pagamentos', 'i-card'], ['compliance', 'Compliance', 'i-shield'], ['config', 'Configurações', 'i-gear']];

  function startConsole() {
    $('#topbar-user').hidden = false;
    document.body.classList.add('app-shell');
    app.innerHTML = '<div class="console" id="console"><nav class="console__nav" id="console-nav" aria-label="Console"><div class="console__nav-title">Endeavor Console</div><ul>' +
      NAV.map(function (n) { return '<li><a href="#/' + n[0] + '" data-view="' + n[0] + '"><svg class="icon" aria-hidden="true"><use href="#' + n[2] + '"/></svg>' + n[1] + '</a></li>'; }).join('') +
      '</ul><div class="console__nav-foot">Endeavor Business Solutions<br>Acesso restrito</div></nav><div class="nav-backdrop" id="nav-backdrop"></div><main class="console__content" id="view" tabindex="-1"></main></div>' +
      '<div class="overlay" id="overlay" hidden></div>';
    var tgl = $('#nav-toggle'), con = $('#console');
    tgl.hidden = false;
    function setNav(open) { con.classList.toggle('nav-open', open); tgl.setAttribute('aria-expanded', String(open)); tgl.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu'); }
    tgl.onclick = function () { setNav(!con.classList.contains('nav-open')); if (con.classList.contains('nav-open')) { var a = $('.console__nav a'); if (a) a.focus(); } };
    $('#nav-backdrop').onclick = function () { setNav(false); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && con.classList.contains('nav-open')) { setNav(false); tgl.focus(); } });
    window.addEventListener('hashchange', function () { setNav(false); route(); });
    loadSettings().then(route);
    if (window.AdminPayments && AdminPayments.bell) AdminPayments.bell(clientsCtx());
    if (window.AdminOA) AdminOA.subscribe(clientsCtx());
  }
  async function loadSettings() { var r = await sb.from('booking_settings').select('*').eq('id', 1).single(); if (!r.error) state.settings = r.data; }

  function route() {
    var v = (ERoute.get().replace(/^#\/?/, '') || 'dashboard').split('?')[0];
    if (!NAV.some(function (n) { return n[0] === v; })) v = 'dashboard';
    $$('.console__nav a').forEach(function (a) { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var view = $('#view'); if (!view) return;
    view.classList.remove('is-editor'); view.innerHTML = '<p class="portal-muted">Carregando…</p>'; view.scrollTop = 0;
    ({ dashboard: viewDashboard, crm: viewCrm, clientes: viewClients, agenda: viewAgenda, assinaturas: viewEnvelopes, parceiros: viewPartners, pagamentos: viewPayments, compliance: viewCompliance, config: viewConfig })[v](view).catch(function (e) {
      view.innerHTML = '<div class="portal-alert portal-alert--error">' + esc(errText(e)) + '</div>';
    });
  }
  async function q(promise) { var r = await promise; if (r.error) throw r.error; return r.data; }

  /* ---------- overlay ---------- */
  function openOverlay(html, center) {
    var o = $('#overlay');
    o.className = 'overlay' + (center ? ' overlay--center' : '');
    o.innerHTML = '<div class="' + (center ? 'modal' : 'drawer') + '" role="dialog" aria-modal="true">' + html + '</div>';

  async function drawTab(tab) {
    var body = $('#ag-body'); body.innerHTML = '<p class="portal-muted">Carregando…</p>';

    var nowIso = new Date().toISOString();

  var DAYS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

        '<div class="field"><label for="st-max">Agendar até (dias à frente)</label><input id="st-max" type="number" min="1" max="180" value="' + s.max_days_ahead + '"></div>' +
      '</div><div class="field" style="margin-top:1rem"><label for="st-note">Mensagem mostrada na confirmação</label><textarea id="st-note" rows="2">' + esc(s.meeting_note || '') + '</textarea></div></section>' +
      '<section class="portal-card"><h2 class="portal-h2">Datas bloqueadas</h2><p class="portal-muted">Feriados, viagens ou dias sem atendimento.</p><ul class="list" id="blk-list">' +
        blk.map(function (b) { return '<li><div class="list__main"><strong>' + esc(b.day) + '</strong><span>' + esc(b.reason || '') + '</span></div><button class="btn btn--danger btn--xs" data-del-day="' + esc(b.day) + '">Remover</button></li>'; }).join('') +
      '</ul><div class="portal-btn-row" style="margin-top:.75rem"><input type="date" id="blk-day" aria-label="Data bloqueada" class="toolbar-like"><input type="text" id="blk-reason" placeholder="Motivo (opcional)" aria-label="Motivo"><button class="btn btn--ghost btn--xs" type="button" id="blk-add">Bloquear data</button></div></section>' +
      '<div class="portal-alert" id="av-msg" role="status"></div><button class="btn btn--navy" type="button" id="av-save">Salvar disponibilidade</button>';
    $$('#blk-day, #blk-reason', body).forEach(function (i) { i.style.cssText = 'min-height:2.5rem;padding:.3rem .6rem;border:1.5px solid #8a95a8;border-radius:6px'; });
    function wireRows() {
      $$('.add-slot', body).forEach(function (b) { b.onclick = function () { b.insertAdjacentHTML('beforebegin', slotRow({ start_time: '09:00', end_time: '12:00' })); wireRows(); }; });
      $$('.rm-slot', body).forEach(function (b) { b.onclick = function () { b.closest('.week__slot').remove(); }; });

    $('#blk-add').onclick = async function () {

      var r1 = await sb.from('booking_settings').update(settings).eq('id', 1); if (r1.error) return msg($('#av-msg'), errText(r1.error), 'error');
      var r2 = await sb.from('availability_rules').delete().gte('weekday', 0); if (r2.error) return msg($('#av-msg'), errText(r2.error), 'error');
      if (out.length) { var r3 = await sb.from('availability_rules').insert(out); if (r3.error) return msg($('#av-msg'), errText(r3.error), 'error'); }
      state.settings = Object.assign(state.settings || {}, settings);
      msg($('#av-msg'), 'Disponibilidade salva. A página pública já mostra os novos horários.', 'ok');
    };
  }
  function slotRow(r) {
    return '<div class="week__slot"><input type="time" data-k="start" value="' + esc(String(r.start_time).slice(0, 5)) + '" aria-label="Início"> até <input type="time" data-k="end" value="' + esc(String(r.end_time).slice(0, 5)) + '" aria-label="Fim"><button class="btn btn--danger btn--xs rm-slot" type="button" aria-label="Remover intervalo">Remover</button></div>';
  }

  /* ---------- E-signature ---------- */
  async function viewEnvelopes(view) {
    if (/novo=1/.test(ERoute.get())) return viewEditor(view);
    state.envelopes = await q(sb.from('envelopes').select('*').order('created_at', { ascending: false }).limit(500));
    view.innerHTML = '<div class="console__head"><div><h1>Assinaturas</h1><p class="portal-muted">Prepare documentos, posicione os campos de assinatura e acompanhe tudo por aqui.</p></div>' +
      '<a class="btn btn--navy btn--xs" href="#/assinaturas?novo=1" id="env-new">Novo documento</a></div>' +
      '<div class="toolbar"><input type="search" id="env-q" placeholder="Buscar título ou signatário…" aria-label="Buscar documentos"><select id="env-st" aria-label="Filtrar por status"><option value="">Todos</option><option value="sent">Enviado</option><option value="viewed">Visualizado</option><option value="signed">Assinado</option><option value="voided">Anulado</option><option value="expired">Expirado</option></select></div>' +
      '<div class="table-wrap"><table class="data"><thead><tr><th>Documento</th><th>Signatário</th><th>Status</th><th>Enviado</th><th>Assinado</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody id="env-body"></tbody></table></div>';
    function draw() {
      var t = $('#env-q').value.trim().toLowerCase(), st = $('#env-st').value;
      var rows = state.envelopes.filter(function (e) { return (!st || e.status === st) && (!t || (e.title + ' ' + e.signer_name + ' ' + e.signer_email).toLowerCase().indexOf(t) > -1); });
      $('#env-body').innerHTML = rows.length ? rows.map(function (e) {
        return '<tr data-id="' + esc(e.id) + '" tabindex="0"><td><strong>' + esc(e.title) + '</strong></td><td>' + esc(e.signer_name) + '<span class="sub">' + esc(e.signer_email) + '</span></td><td>' + badge(e.status) + '</td><td>' + esc(fmtDT(e.created_at)) + '</td><td>' + esc(fmtDT(e.signed_at)) + '</td>' +
          '<td><button type="button" class="btn btn--danger btn--xs" data-envdel="' + esc(e.id) + '" aria-label="Excluir ' + esc(e.title) + '">Excluir</button></td></tr>';
      }).join('') : '<tr><td colspan="6" class="empty">Nenhum documento.</td></tr>';
      $$('#env-body tr[data-id]').forEach(function (tr) { tr.onclick = function () { openEnvelope(tr.dataset.id); }; tr.onkeydown = function (ev) { if (ev.key === 'Enter' && ev.target === tr) openEnvelope(tr.dataset.id); }; });
      $$('#env-body [data-envdel]').forEach(function (b) { b.onclick = async function (ev) {
        ev.stopPropagation();
        var e = state.envelopes.find(function (x) { return x.id === b.dataset.envdel; });
        if (await deleteEnvelope(e)) { state.envelopes = state.envelopes.filter(function (x) { return x.id !== e.id; }); draw(); }
      }; });
    }
    $('#env-q').addEventListener('input', draw); $('#env-st').addEventListener('input', draw);
    draw();
  }

  function signLink(e) { return siteUrl('sign.html') + '?t=' + encodeURIComponent(e.token); }

  /* Emails the signing link through the account's FormSubmit form: the signer receives the auto-response with the link,
     and support@endeavorbiz.com receives the notification copy. */
  async function emailSigner(e) {
    var link = signLink(e), exp = new Date(e.token_expires_at).toLocaleDateString('pt-BR');
    var text = 'Olá ' + e.signer_name + ', a Endeavor Business Solutions enviou o documento "' + e.title + '" para sua assinatura eletrônica. ' +
      (e.message ? e.message + ' ' : '') + 'Abra o link para revisar e assinar: ' + link + ' (link pessoal, válido até ' + exp + '). ' +
      '— Hello ' + e.signer_name + ', Endeavor Business Solutions sent you "' + e.title + '" for electronic signature. Review and sign here: ' + link + ' — ' +
      'Hola ' + e.signer_name + ', Endeavor Business Solutions le envió "' + e.title + '" para firma electrónica. Revise y firme aquí: ' + link +
      ' — Endeavor Business Solutions · ' + CFG.adminEmail + ' · +1 (407) 436-9567';
    try {
      var r = await fetch(CFG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _subject: 'Documento enviado para assinatura: ' + e.title + ' → ' + e.signer_name, _template: 'table', _captcha: 'false',
          name: e.signer_name, email: e.signer_email, documento: e.title, link_de_assinatura: link, expira_em: exp, mensagem: e.message || '', _autoresponse: text }) });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok || String(j.success) === 'false') throw new Error(j.message || 'send failed');
      await sb.from('envelope_events').insert({ envelope_id: e.id, event: 'emailed', details: { to: e.signer_email, cc: CFG.adminEmail } });
      return true;
    } catch (err) { console.warn(err); return false; }
  }

  async function viewEditor(view) {
    var leads = await q(sb.from('leads').select('id,name,email').order('created_at', { ascending: false }).limit(500));
    var pre = (ERoute.get().match(/lead=([0-9a-f-]{36})/) || [])[1];
    view.innerHTML = '<p class="portal-muted">Carregando editor…</p>';
    if (!window.EPdf || !window.pdfjsLib || !window.PDFLib || !window.EndeavorEditor) {
      view.innerHTML = '<div class="portal-alert portal-alert--error">Não foi possível carregar o editor de PDF. Verifique a conexão e recarregue a página.</div>'; return;
    }
    view.classList.add('is-editor');
    EndeavorEditor.mount(view, {
      sb: sb, CFG: CFG, esc: esc, msg: msg, errText: errText, sha256Hex: sha256Hex, leads: leads, preLeadId: pre,
      preLead: leads.find(function (l) { return l.id === pre; }), emailSigner: emailSigner,
      onCancel: function () { ERoute.set('#/assinaturas'); },
      onDone: function (e, mailed) {
        ERoute.set('#/assinaturas', true);
        view.classList.remove('is-editor');
        view.innerHTML = '<div class="console__head"><h1>Documento enviado</h1></div><section class="portal-card esx-done">' +
          '<p class="portal-alert portal-alert--ok">' + (mailed ? 'O link de assinatura foi enviado para <strong>' + esc(e.signer_email) + '</strong> e uma cópia foi para ' + esc(CFG.adminEmail) + '.' : 'Documento criado. Copie o link abaixo e envie ao signatário.') + '</p>' +
          '<dl class="kv"><dt>ID do envelope</dt><dd class="mono">' + esc(String(e.id).toUpperCase()) + '</dd><dt>Documento</dt><dd>' + esc(e.title) + '</dd><dt>Signatário</dt><dd>' + esc(e.signer_name) + ' · ' + esc(e.signer_email) + '</dd><dt>Campos</dt><dd>' + (e.fields || []).length + '</dd><dt>Expira</dt><dd>' + esc(fmtDT(e.token_expires_at)) + '</dd></dl>' +
          '<div class="field"><label for="ev-link">Link de assinatura</label><input id="ev-link" readonly value="' + esc(signLink(e)) + '"></div>' +
          '<div class="portal-btn-row"><button class="btn btn--navy" type="button" id="ev-copy">Copiar link</button>' +
          (mailed ? '' : '<button class="btn btn--ghost" type="button" id="ev-mail">Enviar por e-mail</button>') +
          '<button class="btn btn--ghost" type="button" id="ev-view">Ver documento</button><a class="btn btn--ghost" href="#/assinaturas?novo=1">Novo documento</a><a class="btn btn--ghost" href="#/assinaturas">Ver lista</a></div>' +
          '<div class="portal-alert" id="ev-out" role="status"></div></section>';
        $('#ev-copy').onclick = function (b) { copy(signLink(e), b.currentTarget); sb.from('envelope_events').insert({ envelope_id: e.id, event: 'link_copied' }).then(function () {}); };
        $('#ev-view').onclick = function () { viewPdf(e.document_path, e.title, e); };
        if ($('#ev-mail')) $('#ev-mail').onclick = async function (b) { var ok = await emailSigner(e); msg($('#ev-out'), ok ? 'E-mail enviado.' : 'Não foi possível enviar o e-mail agora. Copie o link e envie manualmente.', ok ? 'ok' : 'error'); };
      }
    });
  }

  function clientsCtx() {
    return { sb: sb, CFG: CFG, esc: esc, q: q, msg: msg, errText: errText, fmtDT: fmtDT, openOverlay: openOverlay, closeOverlay: closeOverlay,
      copy: copy, download: download, viewFile: viewFile, sha256Hex: sha256Hex, siteUrl: siteUrl, route: route, $: $ };
  }
  function viewPartners(view) {
    if (!window.AdminPayments) { view.innerHTML = '<div class="portal-alert portal-alert--error">Módulo de parceiros não carregou. Recarregue a página.</div>'; return Promise.resolve(); }
    return AdminPayments.partners(view, clientsCtx());
  }
  function viewCompliance(view) {
    if (!window.AdminOA) { view.innerHTML = '<div class="portal-alert portal-alert--error">Módulo de compliance não carregou. Recarregue a página.</div>'; return Promise.resolve(); }
    return AdminOA.compliance(view, clientsCtx());
  }
  function viewPayments(view) {
    if (!window.AdminPayments) { view.innerHTML = '<div class="portal-alert portal-alert--error">Módulo de pagamentos não carregou. Recarregue a página.</div>'; return Promise.resolve(); }
    return AdminPayments.payments(view, clientsCtx());
  }
  async function viewClients(view) {
    if (!window.AdminClients) { view.innerHTML = '<div class="portal-alert portal-alert--error">Módulo de clientes não carregou. Recarregue a página.</div>'; return; }
    var id = (ERoute.get().match(/[?&]id=([0-9a-f-]{36})/) || [])[1];
    return id ? AdminClients.detail(view, clientsCtx(), id) : AdminClients.list(view, clientsCtx());
  }

  /* Generic in-console file viewer for any private bucket: PDFs and images render inline, other types download. */
  async function viewFile(bucket, path, title, opts) {
    opts = opts || {};
    var isImg = /\.(png|jpe?g|webp|gif)$/i.test(path), isPdf = /\.pdf$/i.test(path) || opts.mime === 'application/pdf';
    var o = openOverlay('<div class="viewer"><div class="viewer__bar"><strong>' + esc(title) + '</strong><div class="portal-btn-row"><button class="btn btn--ghost btn--xs" type="button" id="vw-print"' + (isPdf ? '' : ' hidden') + '>Imprimir</button><button class="btn btn--ghost btn--xs" type="button" id="vw-dl">Baixar</button><button class="close-x" type="button" aria-label="Fechar">×</button></div></div>' +
      '<div class="viewer__pages" id="vw-pages"><p class="portal-muted">Carregando…</p></div></div>', true);
    o.querySelector('.modal').classList.add('modal--wide');
    var r = await sb.storage.from(bucket).createSignedUrl(path, 600);
    if (r.error) { $('#vw-pages').innerHTML = '<div class="portal-alert portal-alert--error">' + esc(errText(r.error)) + '</div>'; return; }
    var blob = null;
    try {
      blob = await (await fetch(r.data.signedUrl)).blob();
      if (isPdf) { var doc = await EPdf.open(new Uint8Array(await blob.arrayBuffer())); await EPdf.render(doc, $('#vw-pages'), { maxWidth: 900, pageLabel: 'Página' }); }
      else if (isImg) { $('#vw-pages').innerHTML = '<img alt="' + esc(title) + '" style="max-width:100%;display:block;margin:0 auto;background:#fff" src="' + URL.createObjectURL(blob) + '">'; }
      else $('#vw-pages').innerHTML = '<div class="empty-state"><strong>Pré-visualização indisponível para este tipo de arquivo.</strong>Use o botão Baixar.</div>';
    } catch (err) { $('#vw-pages').innerHTML = '<div class="portal-alert portal-alert--error">Não foi possível exibir o arquivo.</div>'; }
    var name = (title.replace(/[\\/:*?"<>|]+/g, '-') + (path.match(/\.[a-z0-9]+$/i) || [''])[0]);
    $('#vw-dl').onclick = function () { if (blob) download(name, blob); if (opts.onDownload) opts.onDownload(); };
    $('#vw-print').onclick = function () {
      if (!blob) return;
      var f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0';
      f.src = URL.createObjectURL(blob); document.body.appendChild(f);
      f.onload = function () { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { download(name, blob); } setTimeout(function () { f.remove(); }, 60000); };
    };
  }

  /* In-console PDF viewer with download (no new tabs). */
  async function viewPdf(path, title, e) {
    var o = openOverlay('<div class="viewer"><div class="viewer__bar"><strong>' + esc(title) + '</strong><div class="portal-btn-row"><button class="btn btn--ghost btn--xs" type="button" id="vw-dl">Baixar PDF</button><button class="close-x" type="button" aria-label="Fechar">×</button></div></div>' +
      '<div class="viewer__pages" id="vw-pages"><p class="portal-muted">Carregando documento…</p></div></div>', true);
    o.querySelector('.modal').classList.add('modal--wide');
    var r = await sb.storage.from('documents').createSignedUrl(path, 600);
    if (r.error) { $('#vw-pages').innerHTML = '<div class="portal-alert portal-alert--error">' + esc(errText(r.error)) + '</div>'; return; }
    var bytes;
    try {
      bytes = new Uint8Array(await (await fetch(r.data.signedUrl)).arrayBuffer());
      var doc = await EPdf.open(bytes);
      await EPdf.render(doc, $('#vw-pages'), { maxWidth: 900, pageLabel: 'Página' });
    } catch (err) { $('#vw-pages').innerHTML = '<div class="portal-alert portal-alert--error">Não foi possível exibir o PDF.</div>'; }
    $('#vw-dl').onclick = function () {
      if (!bytes) return;
      download(title.replace(/[\\/:*?"<>|]+/g, '-') + '.pdf', new Blob([bytes], { type: 'application/pdf' }));
      if (e) sb.from('envelope_events').insert({ envelope_id: e.id, event: 'downloaded', details: { file: path.split('/')[0] } }).then(function () {});
    };
  }

  /* Permanently deletes an envelope: original PDF, signed PDF, the record and its audit trail. */
  async function deleteEnvelope(e) {
    if (!e) return false;
    if (e.status === 'signed') {
      var typed = prompt('Excluir definitivamente o documento ASSINADO "' + e.title + '" de ' + e.signer_name + '?\n\nO PDF assinado, o certificado e a trilha de auditoria serão apagados e não podem ser recuperados. Se precisar guardar, baixe antes.\n\nPara confirmar, digite EXCLUIR:');
      if (!typed || typed.trim().toUpperCase() !== 'EXCLUIR') return false;
    } else if (!confirm('Excluir o documento "' + e.title + '"?' + (e.status === 'sent' || e.status === 'viewed' ? ' O link de assinatura deixa de funcionar.' : '') + ' Esta ação não pode ser desfeita.')) return false;
    var paths = [e.document_path, e.signed_document_path].filter(Boolean);
    if (paths.length) {
      var rm = await sb.storage.from('documents').remove(paths);
      if (rm.error) { alert('Não foi possível apagar os arquivos: ' + errText(rm.error)); return false; }
    }
    var r = await sb.from('envelopes').delete().eq('id', e.id);
    if (r.error) { alert('Não foi possível excluir: ' + errText(r.error)); return false; }
    return true;
  }

  async function openEnvelope(id) {
    var e = await q(sb.from('envelopes').select('*').eq('id', id).single());
    var evs = await q(sb.from('envelope_events').select('*').eq('envelope_id', id).order('at'));
    var EV = { created: 'Criado', sent: 'Enviado', emailed: 'E-mail enviado ao signatário', viewed: 'Visualizado', consented: 'Consentiu com registros eletrônicos', signed: 'Assinado', completed: 'Concluído (PDF final gerado)', voided: 'Anulado', downloaded: 'Baixado', link_copied: 'Link copiado' };
    var open = e.status === 'sent' || e.status === 'viewed';
    var o = openOverlay('<div class="drawer__head"><div><h2 class="portal-h2" style="margin:0">' + esc(e.title) + '</h2><p>' + badge(e.status) + '</p></div><button class="close-x" type="button" aria-label="Fechar">×</button></div>' +
      '<dl class="kv"><dt>ID do envelope</dt><dd class="mono">' + esc(String(e.id).toUpperCase()) + '</dd><dt>Signatário</dt><dd>' + esc(e.signer_name) + '<br>' + esc(e.signer_email) + '</dd><dt>Criado</dt><dd>' + esc(fmtDT(e.created_at)) + ' por ' + esc(e.created_by || '') + '</dd>' +
      '<dt>Campos</dt><dd>' + ((e.fields || []).length || 'Bloco de assinatura padrão') + '</dd>' +
      '<dt>Expira</dt><dd>' + esc(fmtDT(e.token_expires_at)) + '</dd>' + (e.signed_at ? '<dt>Assinado</dt><dd>' + esc(fmtDT(e.signed_at)) + ' · IP ' + esc(e.signer_ip) + '</dd><dt>Nome adotado</dt><dd>' + esc(e.signature_name) + '</dd>' : '') +
      '<dt>SHA-256 original</dt><dd class="mono">' + esc(e.document_sha256) + '</dd>' + (e.signed_document_sha256 ? '<dt>SHA-256 assinado</dt><dd class="mono">' + esc(e.signed_document_sha256) + '</dd>' : '') + '</dl>' +
      '<div class="portal-btn-row">' +
        (e.signed_document_path ? '<button class="btn btn--navy btn--xs" type="button" id="e-signed">Ver assinado</button>' : '') +
        '<button class="btn btn--ghost btn--xs" type="button" id="e-orig">Ver original</button>' +
        (open ? '<button class="btn btn--ghost btn--xs" type="button" id="e-copy">Copiar link</button><button class="btn btn--ghost btn--xs" type="button" id="e-mail">Reenviar e-mail</button>' : '') +
        '<button class="btn btn--ghost btn--xs" type="button" id="e-audit">Exportar trilha</button>' +
        (open ? '<button class="btn btn--danger btn--xs" type="button" id="e-void">Anular</button>' : '') +
        '<button class="btn btn--danger btn--xs" type="button" id="e-del">Excluir documento</button>' +
      '</div><div class="portal-alert" id="e-msg" role="status"></div>' +
      '<h3 style="margin-top:1.25rem">Trilha de auditoria</h3><ul class="timeline">' + evs.map(function (x) {
        return '<li><strong>' + esc(EV[x.event] || x.event) + '</strong> · ' + esc(fmtDT(x.at, { timeStyle: 'medium' })) + (x.ip ? '<br><span class="portal-muted">IP ' + esc(x.ip) + ' · ' + esc(String(x.user_agent || '').slice(0, 90)) + '</span>' : '') + '</li>';
      }).join('') + '</ul>');
    if ($('#e-copy', o)) $('#e-copy', o).onclick = function (b) { copy(signLink(e), b.currentTarget); sb.from('envelope_events').insert({ envelope_id: e.id, event: 'link_copied' }).then(function () {}); };
    if ($('#e-mail', o)) $('#e-mail', o).onclick = async function () { var ok = await emailSigner(e); msg($('#e-msg'), ok ? 'E-mail reenviado para ' + e.signer_email + '.' : 'Não foi possível enviar agora. Use "Copiar link".', ok ? 'ok' : 'error'); };
    $('#e-orig', o).onclick = function () { viewPdf(e.document_path, e.title + ' - original', e); };
    if ($('#e-signed', o)) $('#e-signed', o).onclick = function () { viewPdf(e.signed_document_path, e.title + ' - assinado', e); };
    $('#e-audit', o).onclick = function () {
      download('trilha-' + e.id + '.json', JSON.stringify({ envelope: { id: e.id, title: e.title, signer_name: e.signer_name, signer_email: e.signer_email, status: e.status, created_at: e.created_at, signed_at: e.signed_at, signer_ip: e.signer_ip, signer_user_agent: e.signer_user_agent, signature_name: e.signature_name, document_sha256: e.document_sha256, signed_document_sha256: e.signed_document_sha256, fields: e.fields, field_values: e.field_values }, events: evs }, null, 2), 'application/json');
    };
    $('#e-del', o).onclick = async function () { if (await deleteEnvelope(e)) { closeOverlay(); route(); } };
    if ($('#e-void', o)) $('#e-void', o).onclick = async function () {
      if (!confirm('Anular este documento? O link deixa de funcionar.')) return;
      var r = await sb.from('envelopes').update({ status: 'voided' }).eq('id', e.id);
      if (r.error) return msg($('#e-msg'), errText(r.error), 'error');
      await sb.from('envelope_events').insert({ envelope_id: e.id, event: 'voided' });
      closeOverlay(); route();
    };
  }

  /* ---------- Settings ---------- */
  async function viewConfig(view) {
    var u = (await sb.auth.getUser()).data.user;
    var f = (await sb.auth.mfa.listFactors()).data || { totp: [] };
    view.innerHTML = '<div class="console__head"><h1>Configurações</h1></div>' +
      '<section class="portal-card"><h2 class="portal-h2">Conta</h2><dl class="kv"><dt>E-mail</dt><dd>' + esc(u.email) + '</dd><dt>Último acesso</dt><dd>' + esc(fmtDT(u.last_sign_in_at)) + '</dd>' +
      '<dt>Duas etapas</dt><dd>' + ((f.totp || []).filter(function (x) { return x.status === 'verified'; }).length ? 'Ativa (aplicativo autenticador)' : 'Inativa') + '</dd></dl></section>' +
      '<section class="portal-card"><h2 class="portal-h2">Alterar senha</h2><form class="portal-form" id="pw-form"><div class="field"><label for="pw-new">Nova senha (mín. 8 caracteres)</label><input id="pw-new" type="password" autocomplete="new-password" minlength="8" required></div>' +
      '<div class="portal-alert" id="pw-msg" role="status"></div><button class="btn btn--navy" type="submit">Salvar nova senha</button></form></section>' +
      '<section class="portal-card"><h2 class="portal-h2">Segurança</h2><ul class="list"><li><div class="list__main"><strong>Acesso restrito</strong><span>Só o e-mail autorizado, com verificação em duas etapas, consegue ver os dados. As regras ficam no banco de dados.</span></div></li>' +
      '<li><div class="list__main"><strong>Documentos privados</strong><span>Os PDFs ficam em armazenamento privado e só abrem por links temporários.</span></div></li>' +
      '<li><div class="list__main"><strong>Notificações</strong><span>Novos contatos e agendamentos também chegam em ' + esc(CFG.adminEmail) + '.</span></div></li></ul></section>';
    $('#pw-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var p = $('#pw-new').value; if (p.length < 8) return msg($('#pw-msg'), 'Use pelo menos 8 caracteres.', 'error');
      var r = await sb.auth.updateUser({ password: p });
      msg($('#pw-msg'), r.error ? errText(r.error) : 'Senha alterada.', r.error ? 'error' : 'ok');
    });
  }

  boot();
})();
