<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Login | Endeavor Business Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261213">
  <link rel="stylesheet" href="portal.css?v=20261213">
</head>
<body class="portal">
<header class="portal-top">
  <div class="portal-top__inner">
    <a href="index.html" data-keep-lang aria-label="Endeavor Business Hub, home"><img class="portal-top__logo" src="logo-endeavor.svg?v=4" alt="" width="950" height="180"></a>
    <nav class="lang-mini" aria-label="Language">
      <a href="?lang=en" hreflang="en" data-lang="en">EN</a>
      <a href="?lang=pt" hreflang="pt-BR" data-lang="pt">PT</a>
      <a href="?lang=es" hreflang="es" data-lang="es">ES</a>
    </nav>
  </div>
</header>
<main class="portal-main portal-main--auth" id="main">
  <div class="auth portal-card" id="card">
    <h1 class="portal-h1" data-t="title">Sign in</h1>
    <p class="portal-muted" id="lead" data-t="lead">One sign-in for every Endeavor account.</p>
    <form class="portal-form" id="f-login" novalidate>
      <div class="field"><label for="l-email" data-t="email">E-mail</label><input id="l-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass" data-t="password">Password</label><div class="pw-wrap"><input id="l-pass" type="password" autocomplete="current-password" required>
        <button type="button" class="pw-eye" id="l-eye" data-t-aria="showPass" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button></div></div>
      <div class="portal-alert" id="l-msg" role="alert"></div>
      <button class="btn btn--navy btn--block" type="submit" id="l-go" data-t="signIn">Sign in</button>
      <p class="auth-links"><a href="#" id="l-forgot" data-t="forgot">Forgot my password</a></p>
    </form>
    <form class="portal-form" id="f-forgot" novalidate hidden>
      <p class="portal-muted" data-t="forgotLead">Enter your e-mail and we will send a link to create a new password.</p>
      <div class="portal-alert portal-alert--error" id="fg-exp" hidden data-t="linkExpired">This link has expired or was already used. Ask for a new one below.</div>
      <div class="field"><label for="fg-email" data-t="email">E-mail</label><input id="fg-email" type="email" autocomplete="username" required></div>
      <div class="portal-alert" id="fg-msg" role="status"></div>
      <button class="btn btn--navy btn--block" type="submit" id="fg-go" data-t="sendLink">Send the link</button>
      <p class="auth-links"><a href="#" id="fg-back" data-t="backLogin">Back to sign in</a></p>
    </form>
    <div id="pick" hidden>
      <p class="portal-muted" id="pick-lead"></p>
      <div class="portal-btn-row" id="pick-list" style="flex-direction:column;align-items:stretch"></div>
    </div>
    <p class="portal-muted auth-help" data-t="help">Need access? Write to support@endeavorbiz.com.</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="app-config.js?v=20261212"></script>
<script src="portal-common.js?v=20261212"></script>
<script src="session-keep.js?v=20261230"></script>
<script src="login.js?v=20261230"></script>
</body>
</html>
