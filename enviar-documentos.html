<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#07162b">
  <title>Enviar documentos | Endeavor Business Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #07162b; --navy2: #0f2545; --ouro: #c8a45d; --texto: #1f2937; --suave: #5b6576; --linha: #e3e7ee; --fundo: #f3f5f9; --ok: #1f7a4d; --erro: #b42318; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.55 "Inter", system-ui, sans-serif; }
    header { background: var(--navy); padding: 18px 16px; }
    header img { height: 30px; width: auto; display: block; margin: 0 auto; }
    main { max-width: 40rem; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(1.6rem, 1.3rem + 1.2vw, 2rem); line-height: 1.2; margin: 0 0 6px; color: var(--navy); }
    .sub { color: var(--suave); margin: 0 0 22px; }
    .aviso { background: #fff8e6; border: 1px solid #f0d89a; border-radius: 10px; padding: 12px 14px; font-size: 14px; margin: 0 0 20px; }
    .item { background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .item-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .item h2 { font-size: 16px; margin: 0; }
    .selo { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .selo.pendente { background: #eef1f6; color: var(--suave); }
    .selo.recebido { background: #e3f4ea; color: var(--ok); }
    .arquivos { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; color: var(--suave); }
    .arquivos li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
    .enviar { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--navy); color: #fff; font: 600 15px "Inter", sans-serif; cursor: pointer; }
    .btn:hover { background: var(--navy2); }
    .btn:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
    .btn[disabled] { opacity: .55; cursor: default; }
    .status { font-size: 14px; color: var(--suave); }
    .status.erro { color: var(--erro); }
    .barra { height: 6px; background: var(--linha); border-radius: 3px; overflow: hidden; width: 100%; display: none; }
    .barra i { display: block; height: 100%; width: 0; background: var(--ouro); transition: width .2s; }
    .fim { background: #e3f4ea; border: 1px solid #b7e1c8; border-radius: 12px; padding: 16px; color: #14532d; margin-top: 18px; display: none; }
    .rodape { color: var(--suave); font-size: 13px; margin-top: 26px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
<header><img src="logo-endeavor-light.svg?v=3" alt="Endeavor Business Hub" width="160" height="30"></header>
<main id="app" aria-live="polite">
  <h1>Enviar documentos</h1>
  <p class="sub" id="sub">Carregando…</p>
</main>
<script src="app-config.js?v=20261212"></script>
<script>
(function () {
  'use strict';
  var CFG = window.ENDEAVOR_CFG || {}, app = document.getElementById('app');
  var t = new URLSearchParams(location.search).get('t') || '';
  // o token não fica na barra de endereço (nem no histórico), mas a página continua funcionando ao recarregar
  try { if (t) { sessionStorage.setItem('ed-doc-t', t); history.replaceState(null, '', location.pathname); } else t = sessionStorage.getItem('ed-doc-t') || ''; } catch (e) { }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function tam(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  async function api(body) {
    var r = await fetch(CFG.functionsUrl + '/meet', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseKey }, body: JSON.stringify(Object.assign({ t: t }, body)) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.erro || 'Não foi possível concluir. Tente de novo.');
    return j;
  }
  var info;
  async function carregar() {
    try { info = await api({ acao: 'docs_info' }); }
    catch (e) { app.innerHTML = '<h1>Enviar documentos</h1><p class="sub">' + esc(e.message) + '</p>'; return; }
    desenhar();
  }
  function desenhar() {
    var exp = new Intl.DateTimeFormat('pt-BR', { day: 'numeric', month: 'long' }).format(new Date(info.expira));
    app.innerHTML = '<h1>Enviar documentos</h1>' +
      '<p class="sub">' + esc(info.empresa) + (info.reuniao ? ' · ' + esc(info.reuniao) : '') + '<br>Pedido para ' + esc(info.para) + '. O link vale até ' + esc(exp) + '.</p>' +
      (info.mensagem ? '<p>' + esc(info.mensagem) + '</p>' : '') +
      '<div class="aviso">Os arquivos vão direto para um armazenamento privado da Endeavor. Envie só os documentos pedidos. <b>Não escreva números</b> (SSN, ITIN, passaporte ou conta bancária) em e-mail, chat ou mensagens.</div>' +
      info.itens.map(function (i) {
        return '<section class="item" data-k="' + i.k + '"><div class="item-top"><h2>' + esc(i.nome) + '</h2><span class="selo ' + (i.status === 'recebido' ? 'recebido">Recebido' : 'pendente">Pendente') + '</span></div>' +
          (i.arquivos.length ? '<ul class="arquivos">' + i.arquivos.map(function (a) { return '<li>' + esc(a.nome) + (a.tamanho ? ' (' + tam(a.tamanho) + ')' : '') + '</li>'; }).join('') + '</ul>' : '') +
          '<div class="enviar"><label class="btn" tabindex="0" role="button">' + (i.arquivos.length ? 'Enviar outro arquivo' : 'Escolher arquivo') +
          '<input class="sr" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,.doc,.docx,application/pdf,image/*"></label><span class="status"></span><div class="barra"><i></i></div></div></section>';
      }).join('') +
      '<div class="fim" id="fim">Tudo certo: todos os documentos chegaram. Pode fechar esta página.</div>' +
      '<p class="rodape">PDF, JPG, PNG, HEIC ou Word, até 25 MB por arquivo. Dúvidas: support@endeavorbiz.com</p>';
    app.querySelector('#fim').style.display = info.itens.every(function (i) { return i.status === 'recebido'; }) ? 'block' : 'none';
    app.querySelectorAll('.item').forEach(function (s) {
      var lab = s.querySelector('label'), inp = s.querySelector('input');
      lab.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } };
      inp.onchange = function () { if (inp.files[0]) enviar(s, Number(s.dataset.k), inp.files[0]); inp.value = ''; };
    });
  }
  async function enviar(sec, k, f) {
    var st = sec.querySelector('.status'), barra = sec.querySelector('.barra'), lab = sec.querySelector('label');
    st.className = 'status'; st.textContent = 'Enviando ' + f.name + '…'; lab.setAttribute('aria-disabled', 'true'); barra.style.display = 'block';
    var tipo = f.type || (/\.heic$/i.test(f.name) ? 'image/heic' : '');
    try {
      var u = await api({ acao: 'docs_upload_url', item: k, nome: f.name, tipo: tipo, tamanho: f.size });
      await new Promise(function (ok, falha) {
        var x = new XMLHttpRequest(); x.open('PUT', u.url); x.setRequestHeader('Content-Type', tipo); x.setRequestHeader('x-upsert', 'false');
        x.upload.onprogress = function (e) { if (e.lengthComputable) barra.firstChild.style.width = Math.round(e.loaded / e.total * 100) + '%'; };
        x.onload = function () { x.status < 300 ? ok() : falha(new Error('O envio não foi concluído. Tente de novo.')); };
        x.onerror = function () { falha(new Error('Sem conexão. Tente de novo.')); };
        x.send(f);
      });
      await api({ acao: 'docs_confirmar', item: k, path: u.path });
      info = await api({ acao: 'docs_info' }); desenhar();
    } catch (e) { st.className = 'status erro'; st.textContent = e.message; barra.style.display = 'none'; lab.removeAttribute('aria-disabled'); }
  }
  if (!/^[0-9a-f]{64}$/.test(t)) { app.innerHTML = '<h1>Enviar documentos</h1><p class="sub">Link inválido. Confira o link que você recebeu por e-mail.</p>'; return; }
  carregar();
})();
</script>
</body>
</html>
