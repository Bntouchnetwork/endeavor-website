# Endeavor development agent: builds the release on the staging branch and publishes it to the test address.
# Org secrets: ANTHROPIC_API_KEY, GCP_SA_KEY (service account with Firebase Hosting admin), ENDEAVOR_HOOK_KEY.
# Repo variables (set by Endeavor): FIREBASE_PROJECT_ID, ENDEAVOR_PROJECT_ID, ENDEAVOR_HOOK_URL, STAGING_URL.
name: endeavor-build
on:
  workflow_dispatch:
    inputs:
      release_id: { description: "Endeavor release id", required: true }
concurrency: { group: endeavor-staging, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HOOK: ${{ vars.ENDEAVOR_HOOK_URL }}
      KEY: ${{ secrets.ENDEAVOR_HOOK_KEY }}
      REL: ${{ inputs.release_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: staging, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Get the brief from Endeavor
        run: |
          curl -fsS -X POST "$HOOK" -H "Content-Type: application/json" -H "x-booking-key: $KEY" -d "{\"action\":\"brief\",\"release_id\":\"$REL\"}" | jq -r .brief > /tmp/brief.md
          test -s /tmp/brief.md
      - name: Develop with Claude
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          mkdir -p .endeavor
          npx -y @anthropic-ai/claude-code -p "$(cat /tmp/brief.md)" --output-format json --max-turns 120 --dangerously-skip-permissions > /tmp/claude.json || true
          jq -c '{action:"usage", release_id:env.REL, model:(.modelUsage // {} | keys | first // "claude"), input_tokens:(.usage.input_tokens // 0), output_tokens:(.usage.output_tokens // 0), cost_usd:(.total_cost_usd // 0)}' /tmp/claude.json > /tmp/usage.json || echo '{}' > /tmp/usage.json
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" -H "x-booking-key: $KEY" -d @/tmp/usage.json || true
      - name: Install, test and build
        run: |
          if [ -f package.json ]; then npm ci || npm install; npm test --if-present; npm run build --if-present; fi
          if [ ! -d dist ]; then mkdir -p dist && cp -r public/* dist/ 2>/dev/null || true; fi
      - name: Commit to staging
        run: |
          git config user.name "Endeavor AI" && git config user.email "ai@endeavorbiz.com"
          git add -A && (git diff --cached --quiet || git commit -m "Release ${REL}: AI development") && git push origin staging
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - name: Deploy to the test address
        env: { GCP_SA_KEY: "${{ secrets.GCP_SA_KEY }}" }
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa.json && export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx -y firebase-tools@13 deploy --only hosting:staging --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Report to Endeavor
        run: |
          DONE=$(cat .endeavor/done.txt 2>/dev/null | jq -R . | jq -sc 'map(select(length>0))')
          curl -sS -X POST "$HOOK" -H "Content-Type: application/json" -H "x-booking-key: $KEY" -d "{\"action\":\"task\",\"release_id\":\"$REL\",\"done\":${DONE:-[]},\"run_url\":\"$RUN_URL\"}"
          curl -fsS -X POST "$HOOK" -H "Content-Type: application/json" -H "x-booking-key: $KEY" -d "{\"action\":\"staging\",\"release_id\":\"$REL\",\"url\":\"${{ vars.STAGING_URL }}\",\"sha\":\"$SHA\",\"run_url\":\"$RUN_URL\"}"
      - name: Report failure
        if: failure()
        run: curl -sS -X POST "$HOOK" -H "Content-Type: application/json" -H "x-booking-key: $KEY" -d "{\"action\":\"failed\",\"release_id\":\"$REL\",\"error\":\"Workflow failed\",\"run_url\":\"$RUN_URL\"}"
