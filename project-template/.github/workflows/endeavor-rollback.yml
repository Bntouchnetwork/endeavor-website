# Redeploys a previous production release (tag) to the official address.
name: endeavor-rollback
on:
  workflow_dispatch:
    inputs:
      release_id: { required: true }
      tag: { required: true }
concurrency: { group: endeavor-production, cancel-in-progress: false }
jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ vars.ENDEAVOR_HOOK_URL }}
      KEY: ${{ secrets.ENDEAVOR_HOOK_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          if [ -f package.json ]; then npm ci || npm install; npm run build --if-present; fi
          if [ ! -d dist ]; then mkdir -p dist && cp -r public/* dist/ 2>/dev/null || true; fi
      - env: { GCP_SA_KEY: "${{ secrets.GCP_SA_KEY }}" }
        run: |
          echo "$GCP_SA_KEY" > /tmp/sa.json && export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx -y firebase-tools@13 deploy --only hosting:production --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
      - run: curl -fsS -X POST "$HOOK" -H "Content-Type: application/json" -H "x-booking-key: $KEY" -d "{\"action\":\"rolled_back\",\"release_id\":\"${{ inputs.release_id }}\",\"tag\":\"${{ inputs.tag }}\",\"to_number\":\"$(echo ${{ inputs.tag }} | tr -dc 0-9)\"}"
