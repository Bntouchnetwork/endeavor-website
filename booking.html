<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your call | Endeavor Business Solutions</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Reschedule or cancel your call with Endeavor Business Solutions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="portal">
<a class="skip-link" href="#main" data-t="skip">Skip to content</a>
<header class="portal-top">
  <div class="portal-top__inner">
    <a href="index.html" data-keep-lang aria-label="Endeavor Business Solutions, home"><img class="portal-top__logo" src="logo-endeavor.svg" alt="" width="950" height="180"></a>
    <nav class="lang-mini" aria-label="Language">
      <a href="?lang=en" hreflang="en" data-lang="en">EN</a>
      <a href="?lang=pt" hreflang="pt-BR" data-lang="pt">PT</a>
      <a href="?lang=es" hreflang="es" data-lang="es">ES</a>
    </nav>
  </div>
</header>

<main class="portal-main" id="main" tabindex="-1">
  <h1 class="portal-h1" data-t="title">Your call with Endeavor</h1>
  <div class="portal-alert" id="m-msg" role="alert"></div>
  <p class="portal-muted" id="m-loading" data-t="loading">Loading…</p>

  <section class="portal-card" id="m-card" hidden>
    <p class="chosen" id="m-when"></p>
    <p id="m-info" class="portal-muted"></p>
    <p id="m-status"></p>
    <div class="portal-btn-row" id="m-actions">
      <button class="btn btn--navy" type="button" id="m-resched" data-t="resched">Reschedule</button>
      <button class="btn btn--danger" type="button" id="m-cancel" data-t="cancel">Cancel the call</button>
    </div>
  </section>

  <section class="portal-card" id="r-box" hidden aria-labelledby="r-title">
    <h2 class="portal-h2" id="r-title" data-t="pickNew">Choose a new time</h2>
    <p class="portal-muted" id="r-tz"></p>
    <div class="m-days" id="r-days" role="group" aria-labelledby="r-title"></div>
    <div class="slots" id="r-slots" role="group" style="margin-top:1rem"></div>
    <div class="portal-btn-row" style="margin-top:1rem"><button class="btn btn--navy" type="button" id="r-ok" disabled data-t="confirmNew">Confirm new time</button><button class="btn btn--ghost" type="button" id="r-back" data-t="back">Back</button></div>
  </section>

  <section class="portal-card" id="c-box" hidden aria-labelledby="c-title">
    <h2 class="portal-h2" id="c-title" data-t="cancelTitle">Cancel this call?</h2>
    <div class="field"><label for="c-reason" data-t="reason">Reason (optional)</label><textarea id="c-reason" rows="3" maxlength="500"></textarea></div>
    <div class="portal-btn-row"><button class="btn btn--danger" type="button" id="c-ok" data-t="cancelYes">Yes, cancel the call</button><button class="btn btn--ghost" type="button" id="c-back" data-t="keep">Keep the call</button></div>
  </section>

  <section class="portal-card" id="done" hidden tabindex="-1">
    <h2 class="portal-h2" id="done-title"></h2>
    <p id="done-text"></p>
    <div class="portal-btn-row"><a class="btn btn--navy" id="done-book" href="schedule.html" data-keep-lang hidden data-t="bookAgain">Book another time</a><a class="btn btn--ghost" href="index.html" data-keep-lang data-t="site">Back to site</a></div>
  </section>
</main>

<script src="app-config.js"></script>
<script src="portal-common.js"></script>
<script src="booking.js"></script>
</body>
</html>
